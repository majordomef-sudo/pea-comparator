<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Comparateur PEA/AV/CTO Pro</title>
<link rel="stylesheet" href="style.css">
<style>body{padding:10px;background:transparent}.container{padding:10px;max-width:100%}.hero,.etf-table-wrap{display:none}.calculators{padding-top:0;margin-top:0}.calc-panel{display:block!important}</style>
</head><body>
<div class="calculators container">
<div class="calc-panel active" id="tab-pea">
<h3 style="margin-top:0">⚔️ Comparateur PEA vs AV vs CTO</h3>
<div class="calc-grid">
<div><label>Investissement (€)</label><input type="number" id="pea-invest" value="50000" min="0"></div>
<div><label>Durée (années)</label><input type="number" id="pea-years" value="15" min="1" max="50"></div>
<div><label>Rendement annuel (%)</label><input type="number" id="pea-return" value="7" min="0" max="15" step="0.1"></div>
</div>
<button class="btn" id="pea-calc">Comparer</button>
<div id="pea-result" style="margin-top:15px;padding:15px;background:#f5f0eb;border-radius:8px;"></div>
</div></div>
<script src="script.js"></script>
<script>setTimeout(function(){var b=document.getElementById("pea-calc");if(b)b.click()},800)</script>
</body></html>
