<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Calculateur DCA Pro</title>
<link rel="stylesheet" href="style.css">
<style>body{padding:10px;background:transparent}.container{padding:10px;max-width:100%}.hero,.etf-table-wrap{display:none}.calculators{padding-top:0;margin-top:0}.calc-panel{display:block!important}</style>
</head><body>
<div class="calculators container">
<div class="calc-panel active" id="tab-compound">
<h3 style="margin-top:0">📈 Calculateur d"Intérêts Composés</h3>
<div class="calc-grid">
<div><label>Investissement initial (€)</label><input type="number" id="comp-init" value="1000" min="0"></div>
<div><label>Apport mensuel (€)</label><input type="number" id="comp-monthly" value="200" min="0"></div>
<div><label>Durée (années)</label><input type="number" id="comp-years" value="20" min="1" max="50"></div>
<div><label>Rendement annuel (%)</label><input type="number" id="comp-rate" value="8" min="0" max="30" step="0.1"></div>
</div>
<button class="btn" id="comp-calc">Calculer</button>
<div id="comp-result" style="margin-top:15px;padding:15px;background:#f5f0eb;border-radius:8px;"></div>
<div id="comp-chart" style="margin-top:15px;height:250px;"></div>
</div></div>
<script src="script.js"></script>
<script>setTimeout(function(){var b=document.getElementById("comp-calc");if(b)b.click()},800)</script>
</body></html>
