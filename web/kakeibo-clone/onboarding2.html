    // temps de lire sa position finale, sinon la cible mesurée est celle,
    // encore hors écran, du tout début du glissement
    const nextCard = cards[nextIndex];
    nextIcon.style.visibility = 'hidden';
    nextCard.style.transition = 'none';
    const to = nextIcon.getBoundingClientRect();
    void nextCard.offsetHeight;
    nextCard.style.transition = '';
    flyIcon(nextFrom, to, CATS[nextIndex].color, CATS[nextIndex].icon, 480,
      {trackEl:nextIcon, onLand:()=>{ nextIcon.style.visibility = ''; }});
  }
}

/* révélation de la rangée une fois le salaire validé : le gros logo quitte
   le centre de l'écran pour devenir la première pastille, puis toutes les
   autres apparaissent en cascade rapide derrière lui. */
function revealDotsRow(fromRect, cb){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){
    dotEls.forEach(d=>d.classList.remove('pending'));
    cb();
    return;
  }
  /* la pastille cible est encore réduite (.pending, scale(0.3)) : la
     mesurer telle quelle ferait rétrécir le clone jusqu'à devenir
     imperceptible. On lit sa taille finale (sans .pending) instantanément,
     sans transition, avant de la remasquer le temps du vol. */
  const d0 = dotEls[0];
  d0.style.transition = 'none';
  d0.classList.remove('pending');
  const d0Rect = d0.getBoundingClientRect();
  d0.classList.add('pending');
  void d0.offsetHeight;
  d0.style.transition = '';
  /* easing dédié, plus progressif que --ease-slide par défaut : sur ce vol
     précis (longue diagonale centre -> coin haut-gauche + fort rétrécissement
     72px -> ~32px), --ease-slide (cubic-bezier(0.32,0.72,0,1)) parcourait
     ~72% de la distance ET du rétrécissement dans le premier tiers du temps,
     puis rampait à peine le reste : perçu comme "il disparaît puis
     réapparaît" plutôt que "il glisse". cubic-bezier(0.4,0,0.2,1) (courbe
     "standard" Material, pensée pour des déplacements) répartit le
     mouvement sur toute la durée, traçable à l'œil du début à la fin ;
     durée un peu allongée (480 -> 650ms) pour laisser le temps de le suivre. */
  flyIcon(fromRect, d0Rect, CATS[0].color, CATS[0].icon, 650,
    {landEl:d0, hideClass:'pending', restOpacity:1, easing:'cubic-bezier(0.4,0,0.2,1)'});
  dotEls.forEach((d,i)=>{
    if(i===0) return;
    setTimeout(()=>d.classList.remove('pending'), 480+i*70);
  });
  setTimeout(cb, 480+(dotEls.length-1)*70+380);
}

/* petite pluie de confettis (pas de lib externe) : quelques pastilles
   colorées qui jaillissent du centre du donut, montent et s'estompent
   (gravité inversée : +170 tombait vers le bas, -170 pousse vers le haut). */
function spawnConfetti(fromEl){
  const rect = (fromEl||donutWrap).getBoundingClientRect();
  const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
  const colors = ['#3fa970','#1fa896','#8b7cf6','#eeaf3a','#4f8ef7','#2e7d4f'];
  for(let i=0;i<22;i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.background = colors[i%colors.length];
    el.style.borderRadius = (i%2?'50%':'2px');
    el.style.left = cx+'px'; el.style.top = cy+'px';
    document.body.appendChild(el);
    const ang = Math.random()*Math.PI*2, dist = 60+Math.random()*130;
    const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist*0.6 - 40;
    const rot = (Math.random()*520-260);
    el.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:`translate(${dx}px, ${dy-170}px) rotate(${rot}deg)`, opacity:0}
    ], {duration:1100+Math.random()*400, easing:'cubic-bezier(0.23,1,0.32,1)'})
      .onfinish = ()=>el.remove();
  }
}
/* les confettis d'une catégorie validée partaient 120ms après le badge de
   validation, pendant que la part correspondante du donut (segEls[idx],
   voir .dSeg plus haut) met en réalité 1.9s à se dessiner — même défaut de
   délai fixe déjà corrigé sur l'anneau du salaire (voir revealSalaryDonut) :
   les confettis tombaient largement avant que le donut n'ait fini de se
   remplir. transitionend synchronise sur la vraie fin du tracé ; filet de
   sécurité si la part fait 0% (dasharray ne change pas, transitionend ne se
   déclenche jamais dans ce cas). */
function spawnConfettiOnSegFill(idx, fromEl){
  const seg = segEls[idx];
  let done = false;
  const fire = ()=>{ if(done) return; done = true; seg.removeEventListener('transitionend', onDone); spawnConfetti(fromEl); };
  const onDone = (e)=>{ if(e.propertyName === 'stroke-dasharray') fire(); };
  seg.addEventListener('transitionend', onDone);
  setTimeout(fire, 2000);
}
/* après validation du salaire, on prend le temps : seule la question
   s'efface (le montant, lui, reste bien en place, jamais remplacé) ; un
   anneau vient l'entourer (départ à midi, tour complet dans le sens
   horaire, retour à midi), et c'est SA fermeture qui déclenche les
   confettis. Un message de satisfaction annonce ensuite la suite (les
   dépenses du mois) avant, seulement alors, de griser l'anneau de suivi
   (différent de celui-ci) et d'enchaîner vers Loyer via cb(). */
function revealSalaryDonut(amount, cb){
  /* Filet de dernier recours, EN PLUS de celui posé sur le transitionend de
     l'anneau plus bas : celui-là ne couvre que CE maillon précis de la
     chaîne (tracé -> message -> envol -> Loyer), mais un iPhone bloqué a
     déjà montré qu'un seul maillon qui casse (transitionend qui ne part
     jamais) peut laisser l'utilisateur coincé à vie sur cet écran, sans
     aucun moyen de revenir en arrière. Si RIEN n'a fait avancer la séquence
     après un délai très généreux (8s, largement au-dessus de la durée
     normale ~3,5s), on saute directement à l'état final (anneau de suivi
     plein, écran salaire masqué) et on appelle cb() nous-mêmes — mieux
     qu'un blocage total même si l'animation de célébration a été sacrifiée
     en route. cbCalled : garde partagée avec la fin normale de la séquence
     (voir revealDotsRow(bigIconRect, cb) plus bas) pour ne jamais appeler
     cb() deux fois si le filet et le chemin normal se chevauchent. */
  let cbCalled = false;
  const callCbOnce = ()=>{ if(cbCalled) return; cbCalled = true; cb(); };
  setTimeout(()=>{
    if(cbCalled) return;
    salaryTransition.classList.add('gone');
    salaryIntro.classList.add('gone');
    donutWrap.classList.remove('big','hidden');
    segEls[0].style.stroke = '#d9d2c3';
    segEls[0].style.strokeWidth = 11;
    segEls[0].style.strokeDasharray = '100 0';
    pctEl.dataset.val = amount;
    sizePctText();
    pctEl.style.color = pctColor(amount);
    pctEl.textContent = fmtRemaining(amount);
    document.getElementById('pctRest').classList.add('on');
    callCbOnce();
  }, 8000);
  // la question s'efface ; l'icône, elle, glisse vers le bas pour se
  // rapprocher de l'anneau qui apparaît juste en dessous, au lieu de rester
  // plantée au-dessus d'un vide. L'anneau lui-même ne bouge jamais :
  // .salTopStack est un overlay absolute ancré sur .salAmtWrap (voir CSS),
  // la disparition de la question ne change donc rien à sa taille/position.
  document.querySelector('.salTopStack .salQ').style.opacity = '0';
  document.getElementById('salBigIcon').classList.add('down');
  setTimeout(()=>{
    const ring = document.querySelector('.salRing .salProg');
    ring.classList.add('drawing');
    /* var(--ease-slide) (transition CSS de .salProg) est très avancée en
       avant : à 63% de sa durée réelle (1,1s), le tracé est déjà à ~98% de
       son parcours visuel. Les confettis partent donc à ce moment-là (0,63 *
       1100 ≈ 700ms), pas à la fin technique (transitionend, ~400ms plus
       tard) : sinon ils "sentent en retard" par rapport à un anneau déjà
       visuellement fini. Le reste de la séquence (message, etc.) continue
       lui d'attendre la vraie fin du tracé. */
    const CONFETTI_DELAY_MS = 700;
    setTimeout(()=>spawnConfetti(document.querySelector('.salAmtWrap')), CONFETTI_DELAY_MS);
    /* toute la suite du parcours (message, envol du logo, passage à Loyer)
       dépend de ce seul transitionend : s'il ne part jamais, l'utilisateur
       est bloqué à vie sur cet écran. C'était le cas sur iPhone — WebKit ne
       déclenche pas fiablement transitionend pour les propriétés SVG comme
       stroke-dasharray (et le mode économie d'énergie peut sauter la
       transition entièrement). Filet de sécurité par minuterie (durée de la
       transition + marge), même principe que celui des icônes de la barre
       finale, avec garde pour ne jamais dérouler la séquence deux fois si
       l'événement finit par arriver quand même. */
    let ringDone = false;
    const onRingDone=(e)=>{
      if(e && e.propertyName!=='stroke-dasharray')return;
      if(ringDone) return;
      ringDone = true;
      ring.removeEventListener('transitionend',onRingDone);
      salaryTransitionMsg.innerHTML = '<span style="color:#2e7d4f;font-size:34px;">'+t('Impressionnant !','Impressive!')+'</span>';
      fadeInScreen(salaryTransition);
      setTimeout(()=>{
        fadeOutScreen(salaryTransition, ()=>{
          // le gros logo est capturé puis masqué NET : son clone (voir
          // revealDotsRow, lancé juste après) prend le relais immédiatement
          // et glisse vers la rangée. Le laisser partir en fondu avec le
          // reste de l'écran (fadeOutScreen(salaryIntro,...) juste en dessous,
          // qui fait fondre .salAmtWrap et donc tout ce qu'il contient)
          // superposait deux logos : le vrai qui s'estompait sur place
          // pendant que le clone volait, perçu comme "il disparaît puis se
          // replace". Seuls l'anneau et le montant partent en fondu derrière lui.
          const bigIcon = document.getElementById('salBigIcon');
          const bigIconRect = bigIcon.getBoundingClientRect();
          bigIcon.style.visibility = 'hidden';
          fadeOutScreen(salaryIntro, ()=>{
            // l'anneau de suivi (celui du reste du parcours) apparaît déjà
            // gris et plein : la célébration a eu lieu sur l'anneau ci-dessus,
            // pas la peine de la rejouer ici
            donutWrap.classList.remove('big','hidden');
            segEls[0].style.stroke = '#d9d2c3';
            segEls[0].style.strokeWidth = 11;
            segEls[0].style.strokeDasharray = '100 0';
            pctEl.dataset.val = amount;
            sizePctText();
            pctEl.style.color = pctColor(amount);
            pctEl.textContent = fmtRemaining(amount);
            document.getElementById('pctRest').classList.add('on');
          });
          revealDotsRow(bigIconRect, callCbOnce);
        });
      }, 1100);
    };
    ring.addEventListener('transitionend', onRingDone);
    setTimeout(()=>onRingDone(), 1100+400); // filet iOS : durée de la transition (1,1s) + marge
    ring.style.strokeDasharray = '100 0';
  }, 550);
}

function countPct(to, el, dur){
  el = el || pctEl; dur = dur || 600;
  const from = parseInt(el.textContent)||0, t0 = performance.now();
  (function tick(t){
    const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
    el.textContent = Math.round(from+(to-from)*e)+'%';
    if(p<1) requestAnimationFrame(tick);
  })(t0);
}

/* même principe que countPct mais compte un montant restant (salaire - engagé)
   plutôt qu'un pourcentage : "from" est repris via data-val car textContent
   contient déjà le symbole € et un séparateur de milliers, imparsables. */
function countRemaining(to, el, dur){
  el = el || pctEl; dur = dur || 600;
  const from = parseFloat(el.dataset.val)||0, t0 = performance.now();
  el.dataset.val = to;
  if(el===pctEl) sizePctText();
  el.style.color = pctColor(to);
  (function tick(t){
    const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
    el.textContent = fmtRemaining(from+(to-from)*e);
    if(p<1) requestAnimationFrame(tick);
  })(t0);
}

/* carte neuve (rien saisi) : la carte entière (via .stage) est grande et centrée
   verticalement, le donut est gros (clavier fermé, écran au repos). Dès qu'on tape
   dedans (focusin), tout rétrécit vers le format compact habituel (clavier ouvert).
   Si le clavier se referme sans validation (focusout), on regonfle carte + donut.
   Le centrage vertical utilise des marges "auto" (calcul fiable par le flexbox)
   converties en valeur px explicite, seule façon d'obtenir une transition animée :
   "auto" n'est pas interpolable. */
function squareStage(tall){
  // "tall" (carte Abonnements, voir CATS[i].pickBrand) : même hauteur que les
  // cartes à un seul montant (la grille de marques défile en interne pour le
  // reste, voir .brandGrid) — une carte plus haute que ça poussait le bouton
  // Continuer hors de l'écran sur mobile (overflow caché sur .app, rien n'y
  // scrolle). On l'ancre juste sous le donut au lieu de la centrer (marge
  // auto), pour éviter le grand vide au-dessus que laissait le centrage.
  const h = Math.max(320, Math.min(420, document.querySelector('.app').clientHeight*0.5));
  stage.style.transition = 'none';
  stage.style.height = h+'px';
  stage.style.marginTop = tall ? '4px' : 'auto';
  /* le donut doit grossir dans la même passe instantanée que le stage :
     sinon sa propre transition (.5s) continue de pousser le stage vers le
     bas pendant un demi-seconde après que setCurrent a mesuré où l'icône
     doit atterrir (voir swapActiveDot), et le clone atterrit décalé par
     rapport à la position réelle, une fois le donut fini de grandir. */
  donutWrap.style.transition = 'none';
  donutWrap.classList.add('big');
  void stage.offsetHeight;
  // "auto" n'est pas interpolable : uniquement pertinent quand on centre
  // (sinon marginTop est déjà une valeur px concrète, rien à résoudre).
  if(!tall)stage.style.marginTop = getComputedStyle(stage).marginTop;
  void stage.offsetHeight;
  stage.style.transition = '';
  donutWrap.style.transition = '';
  sizePctText();
}
// Même géométrie finale que squareStage(), mais jouée AVEC la transition CSS
// de .stage (au lieu de la couper) : utilisée quand la carte est déjà visible
// et qu'on y revient après une interaction (ex. jour de prélèvement d'un
// abonnement choisi) — un retour sec au format carré s'y voit comme une
// téléportation, contrairement au premier passage sur une carte neuve (avant
// tout rendu visible) où squareStage() doit rester instantané.
function squareStageAnimated(tall){
  const h = Math.max(320, Math.min(420, document.querySelector('.app').clientHeight*0.5));
  let targetMarginTop;
  const prevTransition = stage.style.transition;
  if(tall){
    targetMarginTop = '4px'; // valeur px concrète : rien à résoudre, la transition CSS l'anime directement
  } else {
    // "auto" n'est pas interpolable : on le résout en px sans jouer de transition,
    // puis on rejoue le vrai changement (hauteur + marge concrète) transition active.
    const prevMarginTop = stage.style.marginTop;
    stage.style.transition = 'none';
    stage.style.marginTop = 'auto';
    void stage.offsetHeight;
    targetMarginTop = getComputedStyle(stage).marginTop;
    stage.style.marginTop = prevMarginTop;
    void stage.offsetHeight;
  }
  stage.style.transition = prevTransition;
  stage.style.height = h+'px';
  stage.style.marginTop = targetMarginTop;
  donutWrap.classList.add('big');
  sizePctText();
}
// Cascade d'apparition des puces jour du calendrier à chaque révélation du
// bloc (voir .dayChips .chip.pop-in) : une animation CSS pure tournerait dès
// l'insertion dans le DOM, masquée par l'opacity:0 du parent, donc jamais
// visible — on la relance ici en repartant de zéro (reflow forcé) avec un
// délai croissant par puce, plafonné pour rester vif même sur 31 jours.
function popInDayChips(dayBlock){
  const chips = dayBlock.querySelectorAll('.dayChips .chip');
  chips.forEach((chip,i)=>{
    chip.classList.remove('pop-in');
    void chip.offsetWidth;
    chip.style.animationDelay = Math.min(i*10,220)+'ms';
    chip.classList.add('pop-in');
  });
}
function compactStage(hasDay){
  stage.style.marginTop = '0px';
  // Rétréci de 30px (180->150) par le haut : le donut juste au-dessus a
  // grandi d'autant (voir .donutWrap), donc le bas de la carte ne bouge pas.
  // hasDay (grille "quel jour du mois ?", 31 puces sur 5 rangées, voir DAYS,
  // ou les puces "jour de la semaine") a besoin de nettement plus de
  // hauteur, sinon la dernière rangée déborde de la carte blanche et
  // chevauche le bouton Valider. Puces resserrées (voir .chip/.chips) :
  // 380px suffit désormais, contre 420px avant, pour laisser le bouton
  // Continuer visible sans scroller sur les petits écrans.
  // 'freq' : juste après le montant, tant qu'aucune fréquence n'est choisie,
  // seules les 3 cartes de fréquence (+ leur équivalent €/mois) sont
  // affichées — un rectangle plus petit que 380px suffit, et grandit ensuite
  // (transition height déjà posée sur .stage) au moment où soit le
  // calendrier (mensuel/plusieurs fois), soit les jours de la semaine,
  // apparaissent en fondu dedans.
  stage.style.height = hasDay === 'freq' ? '330px' : (hasDay ? '380px' : '150px');
  donutWrap.classList.remove('big');
  sizePctText();
}

function setCurrent(i){
  obTrack(CATS[i].id, i+1); // funnel : étape atteinte (welcome=0, salaire=1, ...)
  cards.forEach((c,j)=>c.classList.toggle('cur', j===i));
  dotEls.forEach((d,j)=>{ d.classList.toggle('cur', j===i); d.classList.toggle('done', j<i && !!results[j]); });
  btnValider.style.background = CATS[i] ? CATS[i].color : '#3fa970';
  btnValider.textContent = t('Valider','Confirm');
  btnValider.classList.toggle('off', !parseAmt(inputOf(i).value));

  const isIncomeCard = !!(CATS[i] && CATS[i].isIncome);
  // Le bouton #valider est PARTAGÉ entre toutes les étapes et reste toujours
  // dans le flux (.off ne fait que le rendre transparent, sans libérer sa
  // place réservée en bas de #flow) — même invisible, sa hauteur influence
  // l'espace dispo pour #salaryIntro au-dessus (flex:1). L'écran salaire n'en
  // a de toute façon pas besoin : Entrée sur le clavier valide déjà (voir le
  // listener 'keydown' plus bas). display:none le retire complètement du
  // flux le temps de cette étape, au lieu de juste le rendre transparent.
  btnValider.style.display = isIncomeCard ? 'none' : '';
  /* le stage doit déjà être visible, ET la carte déjà dans sa mise en page
     finale (carrée si neuve, compacte sinon), AVANT que swapActiveDot ne
     mesure la position d'arrivée de l'icône cible : sinon la mesure se fait
     sur l'ancienne taille/position (ou un rect vide juste après l'écran du
     salaire, display:none), le clone atterrit au mauvais endroit, et
     l'icône réelle apparaît ensuite ailleurs (plus bas) à sa vraie place.
     squareStage() pose sa géométrie finale instantanément (transition
     coupée puis restaurée dans la même passe), donc rien à attendre ici. */
  if(!isIncomeCard){
    stage.style.display = '';
    // CTA "Installer l'app" visible pendant toute la phase cartes — sauf si
    // l'app est déjà installée / le contexte est standalone (_dlAvailable).
    document.getElementById('dlWrap').classList.toggle('hid', !window._dlAvailable);
    const card = cards[i];
    const fresh = !parseAmt(inputOf(i).value) && !card.classList.contains('hasDay');
    card.classList.toggle('square', fresh);
    if(fresh) squareStage(!!(CATS[i] && CATS[i].pickBrand)); else compactStage(card.classList.contains('hasDay'));
  }

  /* chorégraphie rangée <-> carte : la catégorie qui quitte le rôle "actif"
     regagne sa pastille, celle qui le prend quitte la rangée. Le salaire
     n'a pas de carte (voir revealSalaryDonut) et n'entre donc jamais dans
     ce ballet ; les pastilles pas encore révélées (.pending) non plus. Les
     deux mouvements (retour + départ) passent par le même appel pour que la
     cible de celui qui revient tienne compte du départ de l'autre. */
  const nextFlyingDot = (CATS[i] && !CATS[i].isIncome && dotEls[i] && !dotEls[i].classList.contains('pending')) ? i : null;
  if(nextFlyingDot !== flyingDot){
    swapActiveDot(flyingDot, nextFlyingDot);
    flyingDot = nextFlyingDot;
  }

  if(isIncomeCard){
    // écran d'intro du salaire, sans carte ni donut (celui-ci n'apparaît
    // qu'après validation, voir revealSalaryDonut) : ni le stage (cartes de
    // dépenses) ni le donut ni le CTA d'installation n'ont de raison d'être ici.
    stage.style.display = 'none';
    document.getElementById('dlWrap').classList.add('hid');
    donutWrap.classList.add('hidden');
    // au cas où on revient sur cette carte après une validation précédente
    // (retour arrière) : l'anneau de célébration et la question doivent
    // repartir de zéro (revealSalaryDonut avait effacé la question).
    const salRingCircle = document.querySelector('.salRing .salProg');
    salRingCircle.classList.remove('drawing');
    salRingCircle.style.strokeDasharray = '0 100';
    document.querySelector('.salTopStack .salQ').style.opacity = '';
    document.getElementById('salBigIcon').classList.remove('down');
    fadeInScreen(salaryIntro); // icône + question + anneau, un seul fondu (voir .salAmtWrap)
    return;
  }
  salaryIntro.classList.add('gone');
  salaryIntro.classList.remove('in');
}
/* Édition d'un poste déjà rempli : tap sur son icône (dot) dans la rangée du
   haut. Remplace l'ancien bouton retour, qui effaçait tout depuis le poste
   précédent : ici on ne touche qu'au poste choisi, et on revient ensuite
   exactement là où l'utilisateur en était (voir finishEdit). Les Abonnements
   sont exclus : leur montant est une somme de plusieurs marques, "changer le
   montant" n'a pas de sens direct pour ce poste. */
function editCategory(j){
  if(phase === 'locked' || j === cur || CATS[j].isIncome || CATS[j].pickBrand || !results[j]) return;
  if(editReturn === null) editReturn = {index:cur, phase:phase};
  cards[j].classList.remove('past','okd','celebrate');
  cur = j; phase = 'amount';
  setCurrent(cur);
  inputOf(cur).focus({preventScroll:true});
  inputOf(cur).select();
}
dotEls.forEach((d,j)=>d.addEventListener('click', ()=>editCategory(j)));

function finishEdit(entry, viaKb){
  phase = 'locked';
  results[cur] = entry;
  const card = cards[cur];
  card.classList.toggle('celebrate', !!viaKb);
  card.classList.add('okd');
  // paintSegs() DOIT tourner avant d'attacher le filet transitionend
  // (spawnConfettiOnSegFill) : c'est lui qui pose la nouvelle valeur de
  // stroke-dasharray et démarre donc la transition qu'on veut écouter.
  paintSegs();
  countRemaining(salary-totalEngaged());
  if(viaKb){
    btnValider.classList.add('off');
    const badge = celebrateCheckShow(CATS[cur].color);
    spawnConfettiOnSegFill(cur, badge);
  } else {
    btnValider.textContent = t('Super !','Great!');
  }
  if(document.activeElement) document.activeElement.blur();
  const ret = editReturn; editReturn = null;
  setTimeout(()=>{
    card.classList.remove('celebrate');
    celebrateCheckHide();
    card.classList.add('past');
    cur = ret.index; phase = ret.phase;
    setCurrent(cur);
    setTimeout(()=>{
      if(cur === ret.index && phase === 'amount') inputOf(cur).focus({preventScroll:true});
    }, 450);
  }, 850);
}

/* ── validation d'une étape ── */
function finishStep(entry, viaKb){
  phase = 'locked';
  results[cur] = entry;

  if(CATS[cur].isIncome){
    // pas de carte à glisser pour le salaire : l'écran d'intro s'efface, le
    // donut se révèle (pop + confettis), grise, puis on enchaîne sur Loyer
    salary = entry.amount;
    if(document.activeElement) document.activeElement.blur();
    btnValider.classList.add('off');
    revealSalaryDonut(entry.amount, ()=>{
      cur = 1; phase = startPhase(1); setCurrent(cur);
      setTimeout(()=>{
        if(cur === 1 && phase === 'amount') inputOf(1).focus({preventScroll:true});
      }, 450);
    });
    return;
  }

  const card = cards[cur];
  /* validée via "Suivant" au clavier : le clavier se baisse le temps de
     passer à la carte suivante (voir commentaire plus bas) — un rond vert
     centré + confettis rend ce trou satisfaisant au lieu de bancal, et le
     bouton Valider (qui ne sert qu'à ceux qui tapotent) disparaît puisqu'il
     n'a pas été utilisé. */
  card.classList.toggle('celebrate', !!viaKb);
  card.classList.add('okd');
  // paintSegs() DOIT tourner avant d'attacher le filet transitionend
  // (spawnConfettiOnSegFill) : c'est lui qui pose la nouvelle valeur de
  // stroke-dasharray et démarre donc la transition qu'on veut écouter.
  if(entry){
    paintSegs();
    countRemaining(salary-totalEngaged());
  }
  if(viaKb && entry){
    btnValider.classList.add('off');
    const badge = celebrateCheckShow(CATS[cur].color);
    spawnConfettiOnSegFill(cur, badge);
  } else {
    btnValider.textContent = entry ? 'Super !' : 'Valider';
  }

  const next = cur+1;
  /* le clavier ferme de toute façon (Samsung ignore enterkeyhint) : on le ferme
     immédiatement pour que ça se passe pendant le glissement de carte */
  if(document.activeElement) document.activeElement.blur();

  setTimeout(()=>{
    card.classList.remove('celebrate');
    celebrateCheckHide();
    card.classList.add('past');
    if(next < N){
      cur = next; phase = startPhase(next); setCurrent(cur);
      /* réouverture automatique du clavier une fois la carte en place —
         juste après la fin du glissement (.5s), pas ~2s après comme avant,
         sauf si l'utilisateur a déjà agi — inutile tant qu'il faut d'abord
         choisir une marque d'abonnement */
      setTimeout(()=>{
        if(cur === next && phase === 'amount') inputOf(cur).focus({preventScroll:true});
      }, 450);
    }
    else finale();
  }, 850);
}

function validate(viaKb){
  if(phase === 'locked') return;
  const c = CATS[cur], card = cards[cur];
  // en phase "quel abonnement ?" avec au moins un déjà ajouté, il n'y a pas
  // de montant à valider ici : Valider ("Continuer") clôt directement la
  // boucle, plutôt que de faire le tour par un montant vide
  if(phase === 'brand' && card._subs && card._subs.length){
    finishStep({cat: c, subs: card._subs});
    return;
  }
  // Abonnements : le montant n'est jamais tapé, c'est le prix de base de la
  // marque (voir BRAND_PRICES) posé au tap de la puce, cf. handler 'brand'.
  const amt = c.pickBrand ? (card._pendingAmt||0) : parseAmt(inputOf(cur).value);
  if(!amt){ card.style.animation='none'; return; }
  // étape montant -> jour (askDay, ex. Loyer/Abonnements) ou fréquence
  // (askFreq, ex. Courses/Transport) : révèle le bloc suivant sans finir la carte.
  if(phase === 'amount' && (c.askDay || c.askFreq)){
    /* les chips n'ont pas besoin du clavier : fermeture immédiate */
    if(document.activeElement) document.activeElement.blur();
    card.classList.remove('square');
    card.classList.add('hasDay');
    compactStage(c.askFreq ? 'freq' : true);
    if(c.askDay){
      phase = 'day';
      const _db = card.querySelector('.dayBlock');
      _db.classList.add('show');
      popInDayChips(_db);
      btnValider.textContent = t('Choisis un jour','Pick a day');
      btnValider.classList.remove('off');btnValider.classList.add('disabled');
    } else {
      phase = 'freq';
      card.querySelector('.freqBlock').classList.add('show');
      btnValider.textContent = t('Continuer','Continue');
      btnValider.classList.remove('off');btnValider.classList.add('disabled');
      /* rappel sous chaque carte, affiché dès l'affichage (pas besoin d'avoir
         choisi la fréquence pour le voir) : le montant saisi est TOUJOURS le
         budget mensuel (voir monthlyAmount) — "1 fois par mois"/"plusieurs fois
         par mois" l'affichent donc tel quel, "chaque semaine" affiche son
         équivalent hebdo (÷4, approximation simple avant que les jours cochés
         ne soient connus — voir perOccurrenceAmount pour le calcul exact une
         fois la fréquence choisie). */
      card.querySelectorAll('.freqBlock .freqCardWrap').forEach(wrap=>{
        const fq = wrap.querySelector('.freqCard').dataset.freq;
        wrap.querySelector('.freqCardHint').textContent =
          fq==='weekly' ? (Math.round(amt/4)+t(' €/semaine',' €/week')) : (amt+t(' €/mois',' €/month'));
      });
    }
    return;
  }
  // étape fréquence -> jour du mois (mensuel/plusieurs fois) ou jour de
  // semaine (chaque semaine) : le tap sur une carte de fréquence bascule
  // déjà directement phase='day'/'weekday' (voir le handler de clic sur
  // .freqCard), donc phase n'est plus jamais 'freq' ici.
  const isMultiDay = phase==='day' && card.querySelector('.dayBlock').classList.contains('multi');
  const day = (phase === 'day' && !isMultiDay) ? +card.querySelector('.dayBlock .chip.sel').dataset.d : null;
  const days = isMultiDay ? [...card.querySelectorAll('.dayBlock .chip.sel')].map(b=>+b.dataset.d) : null;
  if(isMultiDay && !days.length){ card.style.animation='none'; return; }
  // "chaque semaine" : sélection multiple des jours de la semaine (ex. deux
  // fois par semaine, lundi + jeudi), comme "plusieurs fois par mois" plus haut.
  const weekdays = (phase === 'weekday') ? [...card.querySelectorAll('.weekdayBlock .chip.sel')].map(b=>+b.dataset.w) : null;
  if(weekdays && !weekdays.length){ card.style.animation='none'; return; }
  const freq = card._freq || (c.askDay ? 'monthly' : undefined);
  const entry = {cat:c, amount:amt, day, freq};
  if(weekdays) entry.weekdays = weekdays;
  if(days) entry.days = days;
  if(editReturn){ finishEdit(entry, viaKb); return; }
  if(c.pickBrand){ addSubscriptionEntry(amt, day); return; }
  finishStep(entry, viaKb);
}

/* Abonnements : après le montant + jour d'une marque, on ne passe PAS à la
   catégorie suivante — on revient au choix de marque pour pouvoir en
   ajouter d'autres (Netflix, puis Spotify, puis...), jusqu'à ce que
   l'utilisateur tape "Continuer". */
function addSubscriptionEntry(amt, day){
  const c = CATS[cur], card = cards[cur];
  const brand = c.name; // déjà mis à jour au choix de la marque (voir plus bas)
  if(!card._subs) card._subs = [];
  card._subs.push({brand, amount:amt, day});

  // la puce elle-même (colorée, voir .brandChip.added) suffit à montrer ce
  // qui est déjà ajouté : pas de liste récap séparée en dessous, ça prenait
  // trop de place pour une info déjà visible dans la grille
  const chip = card.querySelector('.brandChip[data-b="'+brand+'"]');
  if(chip) chip.classList.add('added');

  // remet le montant/jour à zéro pour la prochaine marque
  const inp = inputOf(cur);
  inp.value = ''; inp.style.width = '1ch';
  card.querySelector('.amtWrap').classList.add('empty','hideUntilBrand');
  card.classList.remove('hasDay');
  // 'gone' reposé (pas juste 'show' retiré) : sinon ce dayBlock, encore présent en
  // display:block/flex, recommence à voler de la hauteur au brandBlock (flex:1) de
  // la carte carrée qu'on réaffiche juste en dessous — même raison que le template.
  card.querySelector('.dayBlock').classList.remove('show');
  card.querySelector('.dayBlock').classList.add('gone');
  // un abonnement est déjà ajouté : Valider n'a plus rien à valider ici (le
  // montant est vide, en attente d'une nouvelle marque), il sert plutôt à
  // clore la boucle "encore un abonnement ?" — remplace l'ancien bouton
  // "Continuer" séparé
  btnValider.textContent = t('Continuer','Continue');
  btnValider.classList.remove('off');

  // retour à l'écran de choix (encore carré/centré, comme au tout premier arrivage) :
  // l'icône de la carte redevient l'icône générique "Abonnements", le logo
  // de la marque qu'on vient d'ajouter ne doit rester que le temps de SA saisie
  CATS[cur].name = 'Abonnements'; // "Netflix" ne doit s'afficher que pendant SA saisie
  card.querySelector('.cName').textContent = t('Abonnements','Subscriptions');
  const cIcon = card.querySelector('.cIcon');
  cIcon.innerHTML = c.icon;
  cIcon.style.background = c.color;
  phase = 'brand';
  card.querySelector('.brandBlock').classList.remove('gone');
  card.querySelector('.brandBlock').classList.add('show');
  card.classList.add('square');
  squareStageAnimated(true); // toujours la carte Abonnements ici (voir commentaire de la fonction)

  // remplissage partiel du donut : somme de tout ce qui a déjà été ajouté ici
  const total = card._subs.reduce((s,x)=>s+x.amount,0);
  paintSegs(cur, total);
  countRemaining(salary-totalEngaged(cur, total));
}

/* écouteurs délégués sur #flow (pas juste .stage) : le salaire se tape dans
   #salaryInput, dans l'écran d'intro, hors de .stage. */
/* tap dans la zone de texte : la carte carrée rétrécit vers le format compact
   (l'écran d'intro du salaire, lui, reste fixe : pas de carte à rétrécir) */
flowEl.addEventListener('focusin', e=>{
  if(!e.target.classList.contains('amt') || cur===0) return;
  const card = cards[cur];
  if(card.classList.contains('square')){
    card.classList.remove('square');
    compactStage(false);
  }
});
/* clavier fermé sans validation (tap ailleurs, bouton retour Android...) :
   la carte regonfle. On ignore si une validation/le passage aux chips de
   jour est en cours (phase déjà changée avant le blur). */
flowEl.addEventListener('focusout', e=>{
  if(!e.target.classList.contains('amt') || cur===0) return;
  setTimeout(()=>{
    if(phase !== 'amount') return;
    if(document.activeElement === inputOf(cur)) return;
    /* un montant déjà présent (ex : édition d'un poste via son icône, voir
       editCategory) n'est jamais "carte neuve" : la regonfler ferait sortir
       le bouton Valider de l'écran, sans bouton retour pour s'en sortir */
    if(parseAmt(inputOf(cur).value)) return;
    const card = cards[cur];
    if(!card.classList.contains('square')){
      card.classList.add('square');
      squareStage();
    }
  }, 30);
});

btnValider.addEventListener('click', ()=>{
  // retour visuel immédiat au tap : sur mobile, :active seul est trop
  // capricieux (et la carte/l'écran peuvent disparaître trop vite pour le
  // laisser jouer), donc un petit pressé garanti en JS avant de valider
  btnValider.animate(
    [{transform:'scale(1)'},{transform:'scale(0.94)'},{transform:'scale(1)'}],
    {duration:220, easing:'cubic-bezier(0.23,1,0.32,1)'});
  validate();
});
flowEl.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); validate(true); }});
/* écran salaire : pas de bouton Valider visible (voir setCurrent), donc pas
   de clavier avec touche Entrée sur iOS (pavé décimal = juste une coche qui
   ferme le clavier sans envoyer de keydown 'Enter'). Cette coche ne fait
   qu'un blur : on le détecte pour enchaîner nous-mêmes, comme le ferait Entrée. */
salaryInput.addEventListener('blur', ()=>{
  if(cur===0 && phase==='amount' && parseAmt(salaryInput.value)) validate(true);
});
flowEl.addEventListener('input', e=>{
  if(!e.target.classList.contains('amt')) return;
  const amt = parseAmt(e.target.value);
  /* la pillule Valider n'apparaît qu'une fois un montant saisi */
  btnValider.classList.toggle('off', !amt);
  /* le champ grandit avec la saisie, la zone arrondie reste centrée */
  e.target.style.width = Math.max(1, e.target.value.length)+'ch';
  if(e.target===salaryInput){
    /* grisé tant qu'aucun chiffre n'est saisi (comme le "0" placeholder de
       l'app), vert une fois un montant réel entré */
    const col = amt ? '#2e7d4f' : '#cbbf9e';
    salaryInput.style.color = col;
    document.querySelector('.salEur').style.color = col;
  }
  if(CATS[cur].isIncome) return;
  /* petit zoom de la zone montant à chaque frappe */
  e.target.closest('.amtWrap').classList.toggle('empty', !amt);
  e.target.closest('.amtWrap').animate(
    [{transform:'scale(1)'},{transform:'scale(1.05)'},{transform:'scale(1)'}],
    {duration:180, easing:'cubic-bezier(0.23,1,0.32,1)'});
  /* remplissage live du donut dès la frappe (+ abonnements déjà ajoutés
     avant celui-ci, pour ne pas perdre leur part pendant la frappe) */
  const priorSubs = (cards[cur]._subs||[]).reduce((s,x)=>s+x.amount,0);
  paintSegs(cur, priorSubs+amt);
  countRemaining(salary-totalEngaged(cur, priorSubs+amt), pctEl, 250);
});
flowEl.addEventListener('click', e=>{
  const card = cards[cur];
  const chip = e.target.closest('.chip');
  const freqCard = e.target.closest('.freqCard');
  if(chip && chip.classList.contains('brandChip') && phase==='brand'){
    if(chip.classList.contains('added')) return; // déjà ajouté, on ne repasse pas dessus
    card.querySelectorAll('.brandChip').forEach(b=>b.classList.remove('sel'));
    chip.classList.add('sel');
    chip.classList.remove('pulse');
    void chip.offsetWidth;                     // relance l'animation même si déjà jouée sur cette puce
    chip.classList.add('pulse');
    /* retire la classe une fois le pulse terminé : sinon elle reste sur la
       puce, et la prochaine fois que .brandBlock redevient visible (marque
       suivante), l'animation CSS repart de zéro sur TOUTES les puces déjà
       ajoutées qui l'ont encore — comme si on la retapait à chaque fois. */
    setTimeout(()=>chip.classList.remove('pulse'), 500);
    const brand = chip.dataset.b;
    CATS[cur].name = brand;                    // affiché partout ensuite (carte, calendrier, liste)
    card.querySelector('.cName').textContent = brand;
    // l'icône générique de la carte (le poste "Abonnements") cède la place
    // au vrai logo de la marque choisie, comme dans la grille de sélection
    const cIcon = card.querySelector('.cIcon');
    cIcon.innerHTML = brandIconHtml(brand, 38);
    cIcon.style.background = '#fff';
    // le prix est connu (BRAND_PRICES) : pas de montant à taper, on file
    // directement au choix du jour de prélèvement
    const amt = BRAND_PRICES[brand] || 0;
    card._pendingAmt = amt;
    // laisse le pulse se voir avant que le bloc entier ne s'efface
    setTimeout(()=>{
      card.querySelector('.brandBlock').classList.remove('show');
      card.querySelector('.brandBlock').classList.add('gone');
      phase = 'day';
      card.classList.remove('square');
      card.classList.add('hasDay');
      compactStage(true);
      // remove('gone') d'abord : ce dayBlock démarre 'gone' pour les cartes
      // pickBrand (voir le template plus haut) — sans ça 'gone' (display:none)
      // l'emporterait sur 'show' au même niveau de spécificité (déclaré après
      // dans le CSS), et le calendrier resterait invisible après la marque choisie.
      card.querySelector('.dayBlock').classList.remove('gone');
      card.querySelector('.dayBlock').classList.add('show');
      btnValider.textContent = t('Choisis un jour','Pick a day');
      btnValider.classList.remove('off');btnValider.classList.add('disabled');
      const priorSubs = (card._subs||[]).reduce((s,x)=>s+x.amount,0);
      paintSegs(cur, priorSubs+amt);
      countRemaining(salary-totalEngaged(cur, priorSubs+amt), pctEl, 250);
    }, 260);
    return;
  }
  /* fréquence : pas d'écran/carte séparé pour choisir le(s) jour(s) — dès le
     tap sur une carte de fréquence, le rectangle blanc s'allonge (transition
     height déjà posée sur .stage) et le picker correspondant apparaît en
     fondu dans l'espace ainsi libéré, sans étape "Continuer" intermédiaire.
     "Chaque semaine" garde les 3 cartes de fréquence visibles au-dessus des
     jours (assez compact pour ça) ; "1 fois par mois"/"Plusieurs fois par
     mois" les remplacent par le calendrier (31 jours, pas la place pour les
     deux à la fois). */
  if(freqCard && (phase==='freq' || phase==='weekday' || phase==='day')){
    card.querySelectorAll('.freqCard.sel').forEach(b=>b.classList.remove('sel'));
    freqCard.classList.add('sel');
    const freq = freqCard.dataset.freq;
    const alreadyGrown = phase !== 'freq';
    const wdBlock = card.querySelector('.weekdayBlock');
    const dayBlock = card.querySelector('.dayBlock');
    card._freq = freq;
    if(freq === 'weekly'){
      phase = 'weekday';
      /* redevient visible si on venait de "1 fois par mois"/"plusieurs fois
         par mois" (qui, eux, le masquent pour laisser la place au calendrier). */
      card.querySelector('.freqBlock').classList.remove('gone');
      card.querySelector('.freqBlock').classList.add('show');
      dayBlock.classList.add('gone');
      dayBlock.classList.remove('show');
      dayBlock.querySelectorAll('.chip.sel').forEach(b=>b.classList.remove('sel'));
      if(!alreadyGrown) compactStage(true);
      wdBlock.classList.remove('gone');
      /* force le navigateur à peindre l'état de départ (opacity:0, juste
         retiré de display:none) avant d'ajouter 'show' : sans ce reflow, les
         deux changements de classe sont regroupés dans le même frame et la
         transition CSS ne joue pas, le bloc apparaît d'un coup. Inutile si le
         rectangle est déjà grand (on ne fait que remplacer le calendrier par
         les jours de semaine, pas de fondu à rejouer sur .stage). */
      if(!alreadyGrown) void wdBlock.offsetHeight;
      wdBlock.classList.add('show');
      const n = wdBlock.querySelectorAll('.chip.sel').length;
      btnValider.textContent = n>0 ? (n+t(' jour',' day')+(n>1?'s':'')+t(' par semaine',' per week')) : t('Choisis un jour','Pick a day');
      btnValider.classList.remove('off');
      btnValider.classList.toggle('disabled', n===0);
    } else {
      phase = 'day';
      wdBlock.classList.add('gone');
      wdBlock.classList.remove('show');
      wdBlock.querySelectorAll('.chip.sel').forEach(b=>b.classList.remove('sel'));
      dayBlock.classList.toggle('multi', freq==='multi');
      dayBlock.querySelector('.dayQ').textContent = freq==='multi' ? t('Quels jours du mois ?','Which days of the month?') : t('Quel jour du mois ?','Which day of the month?');
      /* "1 fois par mois"/"plusieurs fois par mois" n'ont pas la place de
         garder les 3 cartes de fréquence affichées en même temps que le
         calendrier : le bloc fréquence sort du flux avant que le calendrier
         n'apparaisse. */
      card.querySelector('.freqBlock').classList.add('gone');
      card.querySelector('.freqBlock').classList.remove('show');
      if(!alreadyGrown) compactStage(true);
      dayBlock.classList.remove('gone');
      if(!alreadyGrown) void dayBlock.offsetHeight;
      dayBlock.classList.add('show');
      popInDayChips(dayBlock);
      btnValider.classList.remove('off');
      if(freq==='multi'){
        const n = dayBlock.querySelectorAll('.chip.sel').length;
        btnValider.textContent = n>0 ? (n+' jour'+(n>1?'s':'')+' par mois') : 'Choisis au moins un jour';
        btnValider.classList.toggle('disabled', n===0);
      } else {
        btnValider.textContent = t('Choisis un jour','Pick a day');
        btnValider.classList.add('disabled');
      }
    }
    return;
  }
  /* "Plusieurs fois par mois" : le calendrier passe en sélection multiple —
     chaque jour coché/décoché reste sur place (pas de validation auto, il
     faut appuyer sur Valider une fois tous les jours choisis, contrairement
     au jour unique du mensuel qui enchaîne directement). */
  if(chip && phase==='day' && card.querySelector('.dayBlock').classList.contains('multi')){
    chip.classList.toggle('sel');
    const n = card.querySelectorAll('.dayBlock .chip.sel').length;
    btnValider.textContent = n>0 ? (n+' jour'+(n>1?'s':'')+' par mois') : 'Choisis au moins un jour';
    btnValider.classList.toggle('disabled', n===0);
    btnValider.classList.remove('off');
    return;
  }
  /* jour du mois (mensuel, sélection unique) : aucun jour pré-sélectionné —
     le bouton Continuer démarre grisé ("Choisis un jour") et ne se colore
     qu'au premier tap sur une puce ; il faut ensuite appuyer dessus pour
     valider (pas d'enchaînement automatique, contrairement au jour de la
     semaine ci-dessous). */
  if(chip && phase==='day'){
    const prevSel = chip.parentElement.querySelector('.sel');
    if(prevSel) prevSel.classList.remove('sel');
    chip.classList.add('sel');
    btnValider.textContent = t('Le '+chip.dataset.d+' de chaque mois','On the '+chip.dataset.d+' each month');
    btnValider.classList.remove('disabled','off');
    return;
  }
  /* jour(s) de la semaine : sélection multiple (ex. lundi + jeudi pour deux
     fois par semaine), même logique que "plusieurs fois par mois" — pas de
     validation auto, juste le libellé du bouton qui reflète le nombre de
     jours cochés (pas de message d'aide séparé sur le montant). */
  if(chip && phase==='weekday'){
    chip.classList.toggle('sel');
    const wdBlock = card.querySelector('.weekdayBlock');
    const n = wdBlock.querySelectorAll('.chip.sel').length;
    btnValider.textContent = n>0 ? (n+t(' jour',' day')+(n>1?'s':'')+t(' par semaine',' per week')) : t('Choisis un jour','Pick a day');
    btnValider.classList.toggle('disabled', n===0);
    btnValider.classList.remove('off');
    return;
  }
  const skipBtn = e.target.closest('.cSkip');
  if(skipBtn && phase!=='locked'){
    // finishStep() enchaîne aussitôt sur la transition de sortie de la carte —
    // appelé dans le même tick que le tap, le fond marron/l'animation n'auraient
    // jamais le temps d'être peints avant que la carte ne parte (même symptôme
    // que le jour du mois qui ne se colorait pas avant la fermeture du bloc,
    // cf. commit sur le calendrier d'abonnement). La classe .pressed (au lieu
    // du seul :active, qui disparaît dès le doigt levé) pilote elle-même sa
    // durée d'affichage (.28s, voir CSS) — mais finishStep() n'a pas besoin
    // d'attendre la fin de CETTE animation-là pour enchaîner : juste assez
    // pour que l'œil capte le début du changement (couleur + amorce du
    // rebond) avant que la carte ne parte, sans ralentir la suite du flux.
    skipBtn.classList.add('pressed');
    // Si la saisie de l'étape courante est complète (le bouton Valider du bas
    // est actionnable ET il y a bien un montant), la flèche agit comme lui —
    // valider/continuer — au lieu de jeter la saisie en sautant la carte.
    // Saisie incomplète (rien tapé, jour/fréquence pas choisis...) : vrai saut.
    const _card=cards[cur];
    const _amtOk = phase!=='amount'
      || (CATS[cur].pickBrand ? (_card&&_card._pendingAmt>0) : parseAmt(inputOf(cur).value)>0);
    const _btnReady = !btnValider.classList.contains('disabled') && !btnValider.classList.contains('off');
    const _act = (_btnReady && _amtOk) ? ()=>validate() : ()=>finishStep(null);
    setTimeout(_act, 100);
    return;
  }
  /* tap n'importe où sur l'écran d'intro (salaire) ou la carte courante = focus du champ */
  if(cur===0 && phase==='amount' && e.target.closest('#salaryIntro')){ inputOf(0).focus({preventScroll:true}); return; }
  const cardEl = e.target.closest('.card');
  if(cardEl === cards[cur] && phase === 'amount') inputOf(cur).focus({preventScroll:true});
});

/* le clavier doit pousser tout l'écran vers le haut (pas juste rester dessous) :
   même technique que _attachKbTracker dans l'app (index.html) — on mesure
   l'espace réellement visible au-dessus du clavier via visualViewport et on
   y contraint la hauteur de .app, ce qui force tout le flex (dots, texte,
   montant, bouton Valider) à se recaser dedans plutôt que de se faire
   recouvrir. Plus fiable que compter sur le "resizes-content" du viewport
   seul, qu'iOS ignore et qu'Android n'applique pas toujours à temps. */
(function attachAppKbTracker(){
  if(!window.visualViewport) return;
  const app = document.querySelector('.app');
  const onVV = ()=>{
    const vv = window.visualViewport;
    const kb = Math.max(0, window.innerHeight-(vv.height+vv.offsetTop));
    app.style.height = kb>40 ? vv.height+'px' : '';
  };
  window.visualViewport.addEventListener('resize', onVV);
  window.visualViewport.addEventListener('scroll', onVV);
  onVV();
})();

/* Le splash de bienvenue (voir #welcomeScreen) s'affiche seul d'abord ;
   setCurrent(0) n'est déclenché qu'au moment où il commence à s'effacer, pour
   que l'icône salaire + "Pour commencer, inscris ton salaire" jouent leur
   propre fondu d'entrée (fadeInScreen dans setCurrent) pendant que le splash
   disparaît, au lieu d'être déjà visibles en dessous. */
obTrack('welcome', 0); // funnel : arrivée sur l'onboarding (splash affiché)
fadeInScreen(document.getElementById('welcomeScreen'), [0,200,1300]); // icône, puis titre, puis sous-texte (pause marquée avant le sous-texte)
setTimeout(()=>{
  const welcome = document.getElementById('welcomeScreen');
  welcome.classList.add('out');
  setCurrent(0);
  setTimeout(()=>welcome.remove(), 350);
}, 3000);

/* ═══ finale : donut proportionnel → barre → calendrier ═══ */
function finale(){
  obTrack('finale', 8); // funnel : écran récap final atteint
  const now = new Date();
  const nDays = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  // weekdayDaysInMonth/occurrenceCount : voir plus haut (partagés avec
  // paintSegs/totalEngaged, pour que le total pendant la saisie et le
  // calendrier final s'accordent toujours).
  const done = results.filter(Boolean);
  const expenses = done.filter(r=>!r.cat.isIncome);
  // un résultat "Abonnements" est {cat, subs:[...]} : plusieurs marques
  // partagent la même part de donut/barre (la couleur de la catégorie),
  // mais chacune garde son propre nom/logo/jour pour le calendrier.
  const expAmt = r => r.subs ? r.subs.reduce((s,x)=>s+x.amount,0) : monthlyAmount(r);
  const totalExp = expenses.reduce((s,r)=>s+expAmt(r),0);
  const denom = salary > 0 ? salary : totalExp;
  const flow = document.getElementById('flow');
  const fin = document.getElementById('fin');
  const fw = document.getElementById('finDonutWrap');
  const finSegs = document.getElementById('finSegs');
  const bar = document.getElementById('bar');
  const barIcons = document.getElementById('barIcons');

  const dayItems = [];
  expenses.forEach(r=>{
    if(r.subs){
      r.subs.forEach(s=>dayItems.push({name:s.brand, amount:s.amount, day:s.day, color:r.cat.color, logo:s.brand, icon:null, isIncome:false}));
    } else if(r.freq==='weekly'){
      // le budget mensuel réparti sur chaque occurrence réelle des jours de
      // semaine cochés (voir perOccurrenceAmount) — une entrée calendrier
      // distincte par occurrence.
      const per = perOccurrenceAmount(r);
      (r.weekdays||[]).forEach(wd=>{
        weekdayDaysInMonth(wd).forEach(d=>dayItems.push({name:r.cat.name, amount:per, day:d, color:r.cat.color, logo:null, icon:r.cat.icon, isIncome:false}));
      });
    } else if(r.freq==='multi'){
      // idem, réparti sur les jours cochés dans le calendrier.
      const per = perOccurrenceAmount(r);
      (r.days||[]).forEach(d=>dayItems.push({name:r.cat.name, amount:per, day:d, color:r.cat.color, logo:null, icon:r.cat.icon, isIncome:false}));
    } else {
      dayItems.push({name:r.cat.name, amount:r.amount, day:r.day, color:r.cat.color, logo:null, icon:r.cat.icon, isIncome:false});
    }
  });
  // salaire affiché lui aussi dans le calendrier (montant en +), posé sur le
  // 30 du mois comme les autres postes sans jour choisi (voir plus bas)
  if(salary > 0){
    dayItems.push({name:t('Salaire','Salary'), amount:salary, day:Math.min(30,nDays), color:'#2e7d4f', logo:null, icon:CATS[0].icon, isIncome:true});
  }

  try{ localStorage.setItem('kk_onb2', JSON.stringify({salary,
    items: dayItems.map(r=>({name:r.name,amount:r.amount,day:r.day}))})); }catch(e){}

  /* Fait apparaître ces postes dans "Dépenses récurrentes"/"Salaire" du mois
     en cours dès l'entrée dans l'app, en remplaçant tout historique
     kk_budget_months résiduel d'un run précédent de l'onboarding — mais sans
     toucher ni aux comptes (kk_accs) ni aux transactions (kk_txns/kk_wealth)
     déjà là : pour la démo TikTok, l'app doit pouvoir déjà contenir des
     comptes/mouvements "vécus" après l'onboarding. Écrit sous une clé "en
     attente" (kk_pending_onboarding_budget) plutôt que directement dans
     kk_budget_months : si ce navigateur a déjà un compte invité d'une visite
     précédente, index.html va d'abord PULL ses données cloud au chargement
     (voir enterApp()), ce qui écraserait sinon cette écriture locale avant
     même le premier rendu — index.html applique cette clé en attente une
     fois ce pull terminé (voir _applyPendingOnboardingData). Un poste
     "chaque semaine"/"plusieurs fois par mois" n'a pas d'équivalent récurrent
     dans ce schéma (juste jour du mois + mois ou "tous les mois") : on pose
     une entrée par occurrence réelle CE mois-ci (monthIdx figé) plutôt que
     d'inventer un jour arbitraire "tous les mois". Un montant/jour unique
     (loyer, abonnement, dépense mensuelle) reste lui vraiment récurrent
     (monthIdx:-1).
  */
  try{
    // Les montants saisis ici sont toujours en euros (€ affiché en dur dans
    // tout l'onboarding), mais kk_budget_months stocke ses montants dans
    // l'unité de base interne de l'app ("PHP", taux 1 — voir CURRENCIES dans
    // index.html), convertie à l'affichage via toCurr/fromCurr selon la
    // devise active. Sans cette conversion, un montant "5" est réinterprété
    // comme 5 unités de base et affiché ~0€ une fois reconverti en euros.
    const EUR_RATE = 0.01404;
    const toBase = eur => eur/EUR_RATE;
    // Les noms de poste d'ici ("Restaurant", "Transport", "Shopping",
    // "Abonnements") n'existent pas tels quels dans les catégories de l'app
    // (DEFAULT_CATS d'index.html : "Restaurants", "Transports en commun",
    // "Shopping divers"...) : posés en `cat` sans traduction, l'app les
    // traitait comme non catégorisés — pas d'icône, pastille "à compléter".
    // Seul "Loyer" matchait par coïncidence. Chaque poste part donc vers sa
    // vraie catégorie ; les marques d'abonnement vers la plus parlante.
    const APP_CAT = {rent:'Loyer', transport:'Transports en commun', groceries:'Courses', restaurant:'Restaurants', shopping:'Shopping divers'};
    const appCatOf = r => APP_CAT[r.cat.id] || r.cat.name;
    const subCatOf = brand =>
      (brand==='Basic Fit'||brand==='Fitness Park') ? 'Sport'
      : (brand==='PlayStation Plus'||brand==='Xbox Game Pass') ? 'Jeux'
      : (brand==='iCloud+'||brand==='Google One'||brand==='Microsoft 365'||brand==='ChatGPT Plus') ? 'Logiciels'
      : 'Streaming';
    const planned = [];
    expenses.forEach(r=>{
      if(r.subs){
        r.subs.forEach(s=>planned.push({label:s.brand, amount:toBase(s.amount), day:s.day||1, monthIdx:-1, cat:subCatOf(s.brand), acc:''}));
      } else if(r.freq==='weekly'){
        const per = toBase(perOccurrenceAmount(r));
        (r.weekdays||[]).forEach(wd=>{
          weekdayDaysInMonth(wd).forEach(d=>planned.push({label:r.cat.name, amount:per, day:d, monthIdx:now.getMonth(), cat:appCatOf(r), acc:''}));
        });
      } else if(r.freq==='multi'){
        const per = toBase(perOccurrenceAmount(r));
        (r.days||[]).forEach(d=>planned.push({label:r.cat.name, amount:per, day:d, monthIdx:now.getMonth(), cat:appCatOf(r), acc:''}));
      } else {
        planned.push({label:r.cat.name, amount:toBase(r.amount), day:r.day||1, monthIdx:-1, cat:appCatOf(r), acc:''});
      }
    });
    const baseSalary = toBase(salary);
    // Le salaire ne part QUE dans le champ salary/salaryDay (comme le fait
    // l'UI budget de l'app elle-même) : l'écrire AUSSI en bonus 'Salaire'
    // le faisait apparaître deux fois le même jour sur le calendrier ET le
    // double-comptait dans les revenus du mois (configuredIncome = salary +
    // bonusTotal côté index.html).
    const monthKey = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    localStorage.setItem('kk_pending_onboarding_budget', JSON.stringify({[monthKey]:{salary:baseSalary, salaryDay:27, bonuses:[], planned}}));
  }catch(e){}

  flow.classList.add('gone');
  fin.classList.add('on');
  fin.scrollTop = 0; // #fin peut hériter un scroll résiduel de l'écran précédent : repart toujours du haut

  /* donut en parts du salaire, tracé en balayage horaire ; le vide = reste à vivre.
     Même mécanique que l'anneau du salaire (.salRing .salProg) : chaque part se
     dessine réellement via une transition stroke-dasharray (même easing
     --ease-slide), au lieu d'être révélée derrière un masque. Budget total
     generous (2.2s pour un tour complet) et MIN_SEG_S : à 0.9s, une part de
     15% n'aurait que ~135ms pour se dessiner sans ce plancher, trop court pour
     être perçu comme un remplissage plutôt qu'un pop instantané. Chaque part
     démarre après que la précédente a fini (délai cumulé = temps réel écoulé,
     pas la position proportionnelle brute) pour rester strictement séquentiel
     malgré cet allongement.
     MIN_SEG_S doit aussi laisser le temps à l'icône du centre (#finSegIcon)
     de finir son fondu : elle prend déjà 0,18s pour disparaître + 0,18s pour
     réapparaître (voir plus bas) = 0,36s. À l'ancien plancher (0,35s), les
     petites parts (Transport/Restaurant/Shopping, souvent sous les ~15% qui
     tombent sur ce plancher) enchaînaient leur icône si vite que le fondu
     de sortie de la suivante coupait celui d'entrée de la précédente en
     plein milieu — rendu perçu comme une icône cassée/pas la bonne le temps
     d'une frame plutôt qu'un simple clignotement. Plancher remonté à 0,5s
     pour laisser un vrai temps de lecture (confirmé en simulant la
     séquence avec une horloge JS virtuelle : chaque icône garde
     maintenant ≥300ms pleinement visible avant le fondu suivant, contre un
     chevauchement possible avant). */
  const DONUT_FILL_S = 2.2;
  const MIN_SEG_S = 0.5;
  // Un bout rond dépasse la longueur mathématique du tracé de stroke-width/2
  // de CHAQUE côté, converti ici en "% de pathLength" (r=50 -> circonférence
  // réelle 2*π*50, mappée sur pathLength=100 : 1% = π px), soit ~2,4%. Sert
  // de SEUIL (voir la boucle de tracé plus bas) : une part n'obtient des
  // bouts ronds que si elle est assez longue (> 2× ce débordement) pour les
  // absorber — en dessous, les caps sont plus gros que la part et bavent sur
  // les voisines. Plus aucun raccourcissement de longueur nulle part : la
  // dernière part (fermeture de la boucle) reste à bout plat sur sa vraie
  // longueur, donc se referme pile à 100%.
  const CAP_OVERSHOOT_PCT = (15/2) / (Math.PI*2*50/100);
  let acc = 0, delay = 0;
  // Icône affichée au centre du donut pendant que chaque part se dessine — un
  // par part visible (+ l'épargne restante), consommé au bon délai plus bas.
  const segIconQueue = [];
  const addSeg = (color,len,icon)=>{
    const dur = len > 0 ? Math.max(len/100*DONUT_FILL_S, MIN_SEG_S) : 0;
    const s = document.createElementNS('http://www.w3.org/2000/svg','circle');
    s.setAttribute('cx',60); s.setAttribute('cy',60); s.setAttribute('r',50);
    s.setAttribute('pathLength',100); s.setAttribute('stroke', color);
    s.style.strokeDasharray = '0 100';
    s.setAttribute('stroke-dashoffset', -acc);
    // Bout plat tant que le tracé n'a pas commencé à se dessiner : à 0 de longueur,
    // un bout arrondi se dessine quand même comme un point (même souci que paintSegs
    // ci-dessus), donc TOUTES les parts pas encore engagées s'affichaient d'un coup
    // en autant de points colorés dispersés sur le cercle, avant même que le
    // remplissage n'atteigne leur position. Le rond n'est activé qu'au moment réel
    // où le segment commence son tracé (voir le setTimeout plus bas).
    s.style.strokeLinecap = 'butt';
    s.style.transition = 'stroke-dasharray '+dur+'s var(--ease-slide) '+delay+'s';
    finSegs.appendChild(s);
    if(len>0)segIconQueue.push({delay,dur,color,icon,s,len});
    acc += len; delay += dur;
  };
  expenses.forEach(r=>{
    const len = Math.max(0, Math.min(expAmt(r)/denom*100, 100-acc));
    addSeg(r.cat.color, len, r.cat.icon);
  });
  const chargesDrawS = delay; // durée du tracé des seules dépenses, avant l'épargne — voir countAmount plus bas
  // Épargne restante : sans ça le donut s'arrêtait au total des charges et le
  // reste du cercle restait vide — comme si le salaire au-delà des dépenses
  // n'existait pas. Même vert que la part correspondante de la barre plus bas.
  const savedAmt = Math.max(0, salary - totalExp);
  addSeg('#3a6b4a', Math.max(0, 100-acc), CATS[0].icon);
  const spentPct = Math.round(Math.min(acc,100));
  const totalDrawS = delay;
  const finSegIconEl = document.getElementById('finSegIcon');
  segIconQueue.forEach(it=>{
    setTimeout(()=>{
      finSegIconEl.style.opacity = '0';
      setTimeout(()=>{
        finSegIconEl.style.background = it.color;
        finSegIconEl.innerHTML = it.icon;
        finSegIconEl.style.opacity = '1';
      },180);
    }, it.delay*1000);
  });

  /* barre positionnée à sa place finale dans le layout ; on la fait partir du centre via transform.
     Composition des dépenses entre elles (dans l'ordre saisi, loyer en premier etc.), comme la
     barre du calendrier de l'app, puis l'épargne restante (salaire - charges) en vert à droite. */
  let barLeftPct = 0;
  const barIconData = [];
  expenses.forEach(r=>{
    const d = document.createElement('div');
    const wPct = expAmt(r)/denom*100;
    d.style.width = wPct+'%'; d.style.background = r.cat.color;
    bar.appendChild(d);
    barIconData.push({leftPct: barLeftPct + wPct/2, color: r.cat.color, icon: r.cat.icon});
    barLeftPct += wPct;
  });
  if(savedAmt > 0){
    const d = document.createElement('div');
    const savedWPct = savedAmt/denom*100;
    d.style.width = savedWPct+'%'; d.style.background = '#3a6b4a';
    bar.appendChild(d);
    // icône salaire centrée sur la part épargne restante, même traitement que
    // les icônes de catégorie (voir barIconData plus bas)
    barIconData.push({leftPct: barLeftPct + savedWPct/2, color: '#3a6b4a', icon: CATS[0].icon});
  }
  /* icônes au-dessus du milieu de chaque part ; si deux tombent trop près l'une
     de l'autre, on les empile un peu (comme les badges du calendrier plus bas). */
  barIconData.forEach(it=>{
    const b = document.createElement('div');
    b.className = 'barIcon';
    b.style.left = it.leftPct+'%';
    b.style.background = it.color;
    b.innerHTML = it.icon;
    barIcons.appendChild(b);
  });

  /* récap chiffré : charges totales vs épargne restante, chacune avec sa
     part du salaire (denom = salaire, ou total des charges si pas de salaire) */
  const finSummary = document.getElementById('finSummary');
  const chargesPct = Math.round(totalExp/denom*100);
  const savedPct = Math.max(0, 100-chargesPct);
  finSummary.innerHTML = `
    <div class="stat">
      <div class="statLbl">${t('Dépenses','Expenses')}</div>
      <div class="statAmt">${Math.round(totalExp)} €</div>
      <div class="statPct">${chargesPct}%</div>
    </div>
    <div class="stat savings">
      <div class="statLbl">${t('Épargne','Savings')}</div>
      <div class="statAmt">${Math.round(savedAmt)} €</div>
      <div class="statPct">${savedPct}%</div>
    </div>`;

  /* calendrier du mois courant, semaine qui commence lundi : même grille et
     même case de jour (chip d'icône 4px, pas un rond) que renderUpcomingCalGrid
     dans l'app. Postes sans jour choisi (tout sauf les abonnements) : posés
     sur la fin du mois (25, 26, 27, 28, 29…), les icônes/logos apparaîtront
     une par une. */
  const grid = document.getElementById('calGrid');
  (LANG==='fr'?['L','M','M','J','V','S','D']:['M','T','W','T','F','S','S']).forEach(h=>{
    const e = document.createElement('div'); e.className='calHead'; e.textContent=h; grid.appendChild(e);
  });
  const first = new Date(now.getFullYear(), now.getMonth(), 1);
  const offset = (first.getDay()+6)%7;
  const todayD = now.getDate();
  for(let i=0;i<offset;i++) grid.appendChild(document.createElement('div'));
  const dayBadgeEls = {};
  const dayAmtEls = {};
  for(let d=1;d<=nDays;d++){
    const e = document.createElement('div'); e.className='calDay';
    if(d===todayD) e.classList.add('today');
    e.innerHTML = '<span class="calDayTop"><span class="calDayNum">'+d+'</span><span class="calBadges"></span></span><span class="calDayAmt"></span>';
    grid.appendChild(e);
    dayBadgeEls[d] = e.querySelector('.calBadges');
    dayAmtEls[d] = e.querySelector('.calDayAmt');
  }
  const usedDays = new Set(dayItems.filter(r=>r.day).map(r=>r.day));
  const pool = [...new Set([25,26,27,28,29,24,23,22,30,31,21].map(d=>Math.min(d,nDays)))];
  let poolPtr = 0;
  dayItems.forEach(r=>{
    if(!r.day){
      while(poolPtr<pool.length && usedDays.has(pool[poolPtr])) poolPtr++;
      r.day = pool[poolPtr]; usedDays.add(r.day); poolPtr++;
    }
  });
  // montant net du jour (charges en -, salaire en +), même convention couleur
  // que renderUpcomingCalGrid dans l'app (vert #3a6b4a / rouge #c03030)
  const fmtCalAmt = n => Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')+'€';
  const dayNet = {};
  dayItems.forEach(r=>{ dayNet[r.day] = (dayNet[r.day]||0) + (r.isIncome ? r.amount : -r.amount); });
  Object.entries(dayNet).forEach(([d,net])=>{
    const el = dayAmtEls[d]; if(!el || Math.abs(net)<0.005) return;
    const pos = net >= 0;
    el.style.color = pos ? '#3a6b4a' : '#c03030';
    el.textContent = (pos?'+':'-')+fmtCalAmt(net);
  });
  const badgeQueue = [];
  // révélées dans l'ordre du calendrier (jour 1, 2, 3…) et non l'ordre de
  // saisie des postes, pour balayer la grille de gauche à droite / haut en
  // bas comme une lecture normale, plutôt que de sauter d'une rangée à
  // l'autre au hasard de l'ordre des catégories.
  [...dayItems].sort((a,b)=>a.day-b.day).forEach(r=>{
    const container = dayBadgeEls[r.day]; if(!container) return;
    const idx = container.children.length;
    const b = document.createElement('span'); b.className='calBadge';
    b.style.left = (idx*7)+'px'; b.style.zIndex = 10-idx;
    if(r.logo && BRAND_LOGOS[r.logo]){ b.innerHTML = brandIconHtml(r.logo, 18); }
    else { b.style.background = r.color; b.innerHTML = r.icon; }
    container.appendChild(b);
    container.style.width = (18+idx*7)+'px';
    badgeQueue.push(b);
  });

  /* récap textuel sous le calendrier, façon liste "Loyer · 780€" : un poste
     = une ligne (montant MENSUEL total, pas par occurrence), contrairement
     à dayItems qui contient une entrée par occurrence calendrier pour les
     postes hebdo/2 semaines. Plafonné pour ne pas pousser le CTA hors écran. */
  const recapRows = [];
  expenses.forEach(r=>{
    if(r.subs) r.subs.forEach(s=>recapRows.push({name:s.brand, amount:s.amount, color:r.cat.color, logo:s.brand, icon:null}));
    else recapRows.push({name:r.cat.name, amount:expAmt(r), color:r.cat.color, logo:null, icon:r.cat.icon});
  });
  // plus gros poste en premier, plutôt que l'ordre de saisie
  recapRows.sort((a,b)=>b.amount-a.amount);
  const recapBox = document.getElementById('recapBox');
  const RECAP_MAX = 10;
  const recapFills = [];
  recapRows.slice(0, RECAP_MAX).forEach(r=>{
    const row = document.createElement('div'); row.className = 'recapRow';
    const iconHtml = (r.logo && BRAND_LOGOS[r.logo])
      ? brandIconHtml(r.logo, 32)
      : '<div class="recapIcon" style="background:'+r.color+'">'+r.icon+'</div>';
    const pct = Math.round(r.amount/denom*100);
    // montant et pourcentage dans la couleur de la catégorie (pas en noir) —
    // seul le nom du poste reste en couleur neutre, pour rester lisible.
    row.innerHTML = '<div class="recapTop">'+iconHtml+'<span class="recapName">'+r.name+'</span>'+
      '<span class="recapAmtCol"><span class="recapAmt" style="color:'+r.color+'">'+Math.round(r.amount)+' €</span>'+
      '<span class="recapPct" style="color:'+r.color+'">'+pct+'%</span></span></div>'+
      '<div class="recapBarTrack"><div class="recapBarFill" style="background:'+r.color+'"></div></div>';
    recapBox.appendChild(row);
    recapFills.push({el:row.querySelector('.recapBarFill'), pct:Math.min(100,pct)});
  });
  // Barre à 0% à la création (voir .recapBarFill), remplie juste après pour que
  // la transition width se joue au lieu de démarrer déjà pleine.
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    recapFills.forEach(f=>{ f.el.style.width = f.pct+'%'; });
  }));
  if(recapRows.length > RECAP_MAX){
    const more = document.createElement('div'); more.className = 'recapMore'; more.textContent = '···';
    recapBox.appendChild(more);
  }

  /* séquence */
  const finPctEl = document.getElementById('finPctAmt');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    /* 1. le donut se dessine et compte jusqu'au total des charges (pas un
       pourcentage), chaque part via sa propre transition stroke-dasharray
       (posée à la création, voir plus haut) — même mécanique que l'anneau
       du salaire. */
    fw.classList.add('on');
    const lastSeg = segIconQueue[segIconQueue.length-1];
    segIconQueue.forEach(it=>{
      it.s.style.strokeDasharray = it.len+' '+(100-it.len);
      /* Caps ronds : un cap déborde de CAP_OVERSHOOT_PCT (~2,4% de
         circonférence) de CHAQUE côté du tracé. Deux cas où ça casse tout
         (capture utilisateur : salaire élevé + petites dépenses, paquet de
         couleurs superposées en haut du donut) :
         - micro-part (1-2%, plus petite que son propre débordement) : ses
           deux caps se chevauchent déjà l'un l'autre et bavent par-dessus
           les voisines. Bout plat en dessous du seuil CAP_OVERSHOOT_PCT —
           tranches nettes, comme le donut de l'app. Seuil à 1×, pas 2× :
           à 2×, une part "normale" mais modeste (ex. Abonnements, souvent
           quelques % du salaire) tombait encore dessous et ressortait à
           bout plat au milieu de parts rondes, incohérent alors qu'elle
           n'a pas besoin de cette protection (ses propres caps ne se
           chevauchent pas entre eux dès qu'elle dépasse 1×).
         - la DERNIÈRE part (l'épargne, qui referme la boucle pile sur le
           début de la première) : son cap avant déborde par-dessus le haut
           du cercle à la fermeture, et son cap ARRIÈRE bave en arrière sur
           la part précédente (fatal quand celle-ci est une micro-part
           entièrement recouverte). Bout plat sur toute sa longueur : elle
           part à ras de la précédente et se referme pile à 100%, à ras du
           départ — aucun raccourcissement à compenser, aucun changement de
           forme en cours de route (les caps ronds des voisines qu'elle
           recouvre sont masqués par l'ordre de peinture, elle est dessinée
           en dernier donc au-dessus). */
      if(it !== lastSeg && it.len > CAP_OVERSHOOT_PCT)
        setTimeout(()=>{it.s.style.strokeLinecap='round';},it.delay*1000);
    });
    const fillMs = totalDrawS*1000;
    /* comme countPct/countRemaining (même easing), mais sans les effets de
       bord pensés pour l'anneau du salaire (couleur, dataset) : juste un
       montant en euros qui monte jusqu'au total des charges. Durée = seulement
       le tracé des dépenses (chargesDrawS), pas le total incluant l'épargne
       restante en vert : sinon le nombre continuait de grimper mollement
       pendant que ce segment vert se dessinait, sans rapport avec lui. */
    (function countAmount(to, el, dur){
      const t0 = performance.now();
      (function tick(t){
        const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
        el.textContent = fmtRemaining(to*e);
        if(p<1) requestAnimationFrame(tick);
      })(t0);
    })(totalExp, finPctEl, chargesDrawS*1000);
    /* 2. crossfade donut → barre (la barre part du centre de l'écran), une fois
       le dessin des parts terminé (plus une courte pause pour le laisser respirer) */
    setTimeout(()=>{
      const barRect = bar.getBoundingClientRect();
      const appRect = document.querySelector('.app').getBoundingClientRect();
      const dy = (appRect.top + appRect.height*0.44) - (barRect.top + barRect.height/2);
      bar.style.transition = 'none';
      bar.style.transform = 'translateY('+dy+'px) scaleX(0.55)';
      void bar.offsetHeight;
      bar.style.transition = '';
      fw.classList.add('morph');
      bar.classList.add('on');

      /* 3. la barre remonte vers son slot, le calendrier apparaît en cascade */
      setTimeout(()=>{
        bar.style.transform = 'translateY(0) scaleX(1)';
        document.querySelectorAll('#fin .pre').forEach((el,i)=>{
          setTimeout(()=>el.classList.add('in'), 260 + i*110);
        });
        /* icônes de la barre : révélées une fois qu'elle a VRAIMENT sa largeur
           finale. getBoundingClientRect() reflète le scaleX en cours à tout
           instant : la mesurer avant la fin de la transition (0.65s) donnait
           une largeur encore rétrécie, donc des % convertis en px trop petits
           — ça déclenchait l'anti-collision à tort (une icône loin à droite,
           ex. Restaurant, se faisait coller aux précédentes au lieu de
           rester à sa vraie position). On attend la fin réelle de la
           transition transform (avec un filet de sécurité au cas où
           transitionend ne se déclenche pas). Anti-collision : toujours sur
           une seule ligne (pas de hauteur en plus) ; une icône trop proche de
           la précédente se décale simplement à sa droite au lieu de se
           chevaucher. */
        const placeBarIcons = ()=>{
          const icons = [...barIcons.children];
          const barW = bar.getBoundingClientRect().width || 1;
          const MIN_GAP = 26; // >= largeur icône (26px) : sinon deux icônes forcées l'une
          const HALF = 13;    // contre l'autre se chevauchent quand même de quelques px.
          const xs = icons.map(el=>parseFloat(el.style.left)/100*barW);
          // Passe avant (gauche → droite) : pousse toute icône trop proche de la
          // précédente vers la droite, comme avant.
          for(let i=1;i<xs.length;i++){ if(xs[i]-xs[i-1]<MIN_GAP) xs[i]=xs[i-1]+MIN_GAP; }
          // Passe arrière (droite → gauche) : sans elle, un groupe serré à gauche
          // (ex. deux icônes très proches) traînait son décalage jusqu'aux icônes
          // suivantes même quand celles-ci avaient largement la place d'être à leur
          // vraie position — l'icône se "souvenait" du décalage au lieu de revenir
          // au plus près de sa place naturelle dès que l'espace le permettait à
          // nouveau. On ramène chaque icône aussi près que possible de sa position
          // d'origine, sans recréer de chevauchement avec sa voisine de droite
          // (déjà figée par la passe avant).
          for(let i=xs.length-2;i>=0;i--){ if(xs[i+1]-xs[i]<MIN_GAP) xs[i]=xs[i+1]-MIN_GAP; }
          // Ne jamais déborder du cadre de la barre (ex. Shopping poussé hors écran) :
          // décale tout le groupe si le dernier dépasse à droite, puis ramène le
          // premier dans le cadre si ça le fait sortir à gauche.
          if(xs.length){
            const overRight = xs[xs.length-1]-(barW-HALF);
            if(overRight>0) for(let i=0;i<xs.length;i++) xs[i]-=overRight;
            if(xs[0]<HALF){ const shift=HALF-xs[0]; for(let i=0;i<xs.length;i++) xs[i]+=shift; }
          }
          icons.forEach((el,i)=>{ el.style.left = xs[i]+'px'; el.classList.add('in'); });
        };
        let _barIconsPlaced = false;
        bar.addEventListener('transitionend', function onBarTransEnd(e){
          if(e.propertyName !== 'transform' || _barIconsPlaced) return;
          _barIconsPlaced = true;
          bar.removeEventListener('transitionend', onBarTransEnd);
          placeBarIcons();
        });
        setTimeout(()=>{ if(!_barIconsPlaced){ _barIconsPlaced = true; placeBarIcons(); } }, 700);
        /* les icônes des postes apparaissent une par une sur leur jour, une
           fois le calendrier en place */
        badgeQueue.forEach((b,i)=>{
          setTimeout(()=>b.classList.add('in'), 450 + i*100);
        });
      }, 520);
    }, fillMs + 600);
  }));
}

document.getElementById('cta').addEventListener('click', (e)=>{
  obTrack('app_open', 9); // funnel : clic "ouvrir l'app", fin du parcours
  spawnConfetti(e.currentTarget);
  setTimeout(()=>{ window.location.href = 'index.html?guest=1'; }, 550);
});
// Zone démo invisible sous le CTA (voir le div #ctaDemo) : l'app s'ouvre
// pré-remplie de données fictives (compte invité neuf, ?demo=1/seedDemoData
// dans index.html). Aucun indice visuel : seul qui sait qu'elle existe la
// trouve, un vrai visiteur ne peut pas tomber dessus par accident d'autant
// qu'il faut un double-tap. Sa hauteur suit celle du bouton juste au-dessus
// (au lieu d'une valeur fixe arbitraire) : plus simple à retrouver puisqu'elle
// correspond exactement à ce qu'on voit à l'écran.
const _sizeCtaDemo=()=>{
  const cta=document.getElementById('cta'),demo=document.getElementById('ctaDemo');
  if(cta&&demo)demo.style.height=cta.offsetHeight+'px';
};
_sizeCtaDemo();
window.addEventListener('resize',_sizeCtaDemo);
let _demoTapT=0;
document.getElementById('ctaDemo').addEventListener('click', ()=>{
  const now=Date.now();
  if(now-_demoTapT<600){
    // finale() (déjà passée, forcément, pour arriver sur cet écran) a écrit
    // le salaire/les dépenses récurrentes saisis dans kk_pending_onboarding_budget,
    // en VRAI localStorage. Mais ?demo=1 côté index.html fait un localStorage.clear()
    // avant de re-remplir un compte invité tout neuf (seedDemoData) : cette clé
    // serait donc effacée avant même d'être lue. On la fait transiter par
    // sessionStorage (pas touché par ce clear()) — index.html la réinjecte juste
    // après son clear(), voir le bloc wantDemo dans boot(). Un run précédent de
    // la démo écrase toujours l'ancien (une seule clé, pas d'accumulation).
    try{
      const pending=localStorage.getItem('kk_pending_onboarding_budget');
      if(pending)sessionStorage.setItem('kk_demo_pending_onboarding_budget',pending);
    }catch(e){}
    window.location.href='index.html?demo=1';
  }
  _demoTapT=now;
});

</script>
