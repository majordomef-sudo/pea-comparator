<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Kakeibo · Onboarding 2</title>
<meta name="color-scheme" content="only light">
<meta name="darkreader-lock">
<!-- Requis pour que Chrome/Android considère la page installable et déclenche
     beforeinstallprompt (le vrai prompt natif du bouton Télécharger) : sans
     manifest lié ICI (pas seulement sur index.html), l'événement ne part jamais
     et le bouton retombait sur le message d'instructions générique. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  color-scheme:only light;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-slide:cubic-bezier(0.32,0.72,0,1);
  --ink:#141110;--sub:#a89e95;--bg:#f5f0e8;
}
html,body{background:#e8e2d6;color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;height:100%;}
body{overflow:hidden;}
.app{position:relative;height:100dvh;max-width:430px;margin:0 auto;overflow:hidden;
  transition:height .22s var(--ease-slide);
  box-shadow:0 0 40px rgba(61,53,48,0.18);
  background:
    radial-gradient(120% 55% at 50% -8%, rgba(201,168,122,0.30) 0%, rgba(201,168,122,0.10) 38%, transparent 62%),
    #f5f0e8;
  display:flex;flex-direction:column;}

/* ═══ flux de saisie ═══ */
#flow{display:flex;flex-direction:column;align-items:center;flex:1;min-height:0;
  padding:calc(20px + env(safe-area-inset-top)) 22px 10px;
  transition:opacity .45s ease,visibility 0s linear .45s;}
/* visibility:hidden en plus de l'opacity:0 (avec le même délai que le fondu, pour ne
   pas couper l'animation) : sur certains navigateurs/appareils l'écran récap (#fin,
   position:absolute par-dessus) laissait quand même passer la rangée d'icônes de
   progression de #flow au travers, opacity:0 seul ne suffisant pas à la faire
   disparaître visuellement une fois le fondu terminé. */
#flow.gone{opacity:0;visibility:hidden;pointer-events:none;}

/* rangée d'icônes de progression */
/* gap/taille réduits pour que la rangée tienne sur une ligne même avec
   beaucoup de postes (11 désormais) */
.dots{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap;justify-content:center;max-width:340px;}
.dot{width:var(--dotSize,32px);height:var(--dotSize,32px);border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:#e9e2d6;flex-shrink:0;overflow:hidden;
  transition:width .65s var(--ease-slide),height .65s var(--ease-slide),background .4s ease,transform .5s var(--ease-out),opacity .35s ease,margin .65s var(--ease-slide);}
.dot svg{width:50%;height:50%;stroke:#b5aa9d;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s ease;}
.dot.cur{transform:scale(1.18);}
.dot.cur,.dot.done{background:var(--c);}
.dot.cur svg,.dot.done svg{stroke:#fff;}
/* le poste déjà rempli reste coloré mais s'efface un peu, pour que l'œil
   aille d'abord vers celui en cours de remplissage */
.dot.done{opacity:0.5;cursor:pointer;}
.dot.done:active{transform:scale(0.88);opacity:0.8;}
/* tant que le salaire n'est pas validé, la rangée est invisible : chaque
   pastille garde sa place (mesurable) mais n'apparaît qu'en cascade, voir
   revealDotsRow en JS */
.dot.pending{opacity:0;transform:scale(0.3);pointer-events:none;}
/* le poste dont l'icône vit actuellement sur la carte quitte la rangée :
   largeur ramenée à 0 (les autres pastilles regagnent l'espace libéré et
   grossissent un peu, voir --dotSize), marge négative pour absorber le gap */
.dot.flying{width:0;height:0;opacity:0;margin:0 -6px;pointer-events:none;}

/* donut : petit pendant la saisie (clavier ouvert), gros au repos (carte neuve, clavier fermé).
   Agrandi de 104 -> 134px : la carte de saisie (.stage, voir compactStage) a été rétrécie
   d'autant en hauteur (180 -> 150px) pour lui laisser la place, en ne mangeant que sur le
   haut de la carte — son bas reste au même endroit, le total dots+donut+stage ne bouge pas. */
.donutWrap{position:relative;width:134px;height:134px;margin:2px 0 12px;flex-shrink:0;
  transition:width .5s var(--ease-slide),height .5s var(--ease-slide),margin-top .5s var(--ease-slide),
    opacity .4s ease,transform .4s var(--ease-slide);}
.donutWrap.big{width:172px;height:172px;}
.donutWrap svg{width:100%;height:100%;transform:rotate(-90deg);}
/* épaisseur proportionnelle à celle du donut final (#finDonutWrap : 15px sur
   190px, ratio ~0,079) plutôt qu'une valeur fixe qui paraissait plus fine à
   mesure que l'anneau grandit (11px sur 172px ne donnait que 0,064) */
.donutWrap circle{fill:none;stroke-width:10.5px;}
.donutWrap.big circle{stroke-width:13.5px;}
.dTrack{stroke:#e7dfd0;}
.dSeg{stroke-dasharray:0 100;stroke-linecap:butt;filter:url(#segGlow);
  transition:stroke-dasharray 1.9s var(--ease-out),stroke .6s ease,stroke-width .25s var(--ease-out);}
.dPct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:800;color:#7a6e65;font-variant-numeric:tabular-nums;
  transition:font-size .5s var(--ease-slide),color .4s ease;}
.donutWrap.big .dPct{font-size:34px;}
/* petit "restant" sous le montant, révélé quand le donut passe du % de
   célébration au reste du salaire (voir revealSalaryDonut) */
.dRest{position:absolute;left:0;right:0;top:calc(50% + 12px);text-align:center;
  font-size:10px;font-weight:700;color:#a89e95;letter-spacing:0.3px;
  opacity:0;pointer-events:none;
  transition:opacity .35s ease,top .5s var(--ease-slide),font-size .5s var(--ease-slide);}
.donutWrap.big .dRest{top:calc(50% + 17px);font-size:11.5px;}
.dRest.on{opacity:1;}
/* le donut n'existe pas encore tant que le salaire n'est pas validé : retiré
   du flux (display:none), pas juste invisible, pour que l'écran d'intro se
   centre sur toute la hauteur disponible sans une réserve d'espace fantôme */
.donutWrap.hidden{display:none;}
@keyframes donutPop{0%{transform:scale(0.6);}55%{transform:scale(1.08);}100%{transform:scale(1);}}
.donutWrap.reveal{animation:donutPop .55s var(--ease-slide);}
.card.salaryCard{display:none;}

/* écran d'intro du salaire, façon question de l'onboarding "récit" (grande
   question + input simple, sans donut) : on tape le montant comme on tapait
   son âge, à même le fond (pas de pastille/carré derrière), même esprit que
   l'écran de saisie de montant de l'app (index.html #amountScreenInput).
   .salAmtWrap (l'anneau + le montant) est le SEUL enfant direct de
   #salaryIntro à participer au centrage flex : c'est ce qui garantit que
   l'anneau reste pile au centre de l'écran, quoi qu'il arrive au-dessus ou
   en dessous de lui. Logo+question (au repos) et le message "Impressionnant !"
   (à la validation) sont chacun un overlay absolute ANCRÉ SUR .salAmtWrap
   (bottom:100% / top:100%) plutôt que des enfants flex normaux : ni l'un ni
   l'autre n'influence donc jamais la taille ou le centrage du bloc qui
   contient l'anneau. Tentatives précédentes qui ne marchaient pas : masquer
   la question (display:none) pour "faire de la place" déplaçait l'anneau
   (le centrage flex recalculait sur un contenu plus court) ; la garder en
   flux mais mettre le message dans un écran séparé plus bas le faisait
   atterrir loin de l'anneau (position dictée par la fin du bloc #salaryIntro
   en flex:1, sans lien avec l'anneau lui-même). */
#salaryIntro{display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex:1;width:100%;max-width:340px;}
#salaryIntro.gone{opacity:0;pointer-events:none;position:absolute;}
/* logo + question au repos : ancrés juste au-dessus de l'anneau, jamais
   dans le flux flex de #salaryIntro (voir commentaire ci-dessus). Simple
   div, plus de fondu .pre indépendant : ils apparaissent avec le reste de
   .salAmtWrap (qui, lui, garde .pre) en un seul fondu, plutôt qu'une
   chorégraphie en deux temps qui n'apporte rien ici. */
.salTopStack{position:absolute;left:50%;bottom:calc(100% + 22px);transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:22px;width:280px;}
/* message "Impressionnant !" : même principe, ancré juste EN DESSOUS de
   l'anneau (jamais au-dessus, à la place de la question) — voir la demande
   explicite de garder le donut au centre et le texte de célébration en bas. */
#salaryTransition{position:absolute;left:50%;top:calc(100% + 22px);transform:translateX(-50%);
  width:280px;text-align:center;}
#salaryTransition.gone{opacity:0;pointer-events:none;}

/* Splash "Bienvenue dans Kakeibo" affiché en tout premier, par-dessus le
   reste (déjà en train de se construire dessous) : simple fondu court avant
   que l'écran du salaire ne joue sa propre entrée, pour familiariser
   l'utilisateur avec l'icône de l'app dès la première seconde. */
#welcomeScreen{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(120% 55% at 50% -8%, rgba(201,168,122,0.30) 0%, rgba(201,168,122,0.10) 38%, transparent 62%), #f5f0e8;
  opacity:1;transition:opacity .35s ease;}
#welcomeScreen.out{opacity:0;pointer-events:none;}
#welcomeScreen img{width:88px;height:88px;border-radius:22px;box-shadow:0 6px 20px rgba(61,53,48,0.18);}
#welcomeScreen .welcomeTitle{font-size:21px;font-weight:800;letter-spacing:-0.4px;color:#8a6d3b;text-align:center;}
#welcomeScreen .welcomeTitleBrand{color:var(--ink);}
#welcomeScreen .welcomeSub{font-size:14px;font-weight:600;color:#3d3530;text-align:center;max-width:260px;line-height:1.4;margin-top:-6px;}
/* gros logo salaire au repos, au-dessus de la question : c'est lui qui vole
   ensuite jusqu'à la rangée d'icônes une fois le salaire validé (voir
   revealDotsRow), pas juste un décor qui s'efface */
.salBigIcon{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:#2e7d4f;flex-shrink:0;transition:transform .5s var(--ease-slide);}
/* la question s'efface sur place (voir .salTopStack .salQ plus bas) mais
   garde sa place réservée dans la colonne flex — sans ce glissement, l'icône
   restait donc plantée au-dessus d'un vide, loin de l'anneau qui apparaît
   juste en dessous. */
.salBigIcon.down{transform:translateY(75px);}
.salBigIcon svg{width:50%;height:50%;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.salQ{font-size:25px;font-weight:800;letter-spacing:-0.4px;line-height:1.3;text-align:center;color:var(--ink);}
/* seule la question (pas l'icône à côté) s'efface à la validation, pour ne
   pas laisser "Pour commencer, inscris ton salaire" affiché pendant la
   célébration — l'icône, elle, reste visible jusqu'à son envol vers la
   rangée (voir revealDotsRow). Fondu simple en JS (style.opacity direct),
   pas le mécanisme .pre générique : ce dernier ne repère que les enfants
   DIRECTS d'un conteneur passé à fadeInScreen/fadeOutChild, et .salQ est ici
   niché dans .salTopStack (voir plus haut). */
.salTopStack .salQ{transition:opacity .5s ease;}
/* isolation:isolate crée un contexte d'empilement propre et local à ce
   conteneur : le z-index du montant/de l'anneau ci-dessous se compare
   alors seulement entre eux, sans dépendre d'un empilement hérité d'un
   ancêtre (ex. .pre pendant sa transition d'entrée).
   min-height:280px = le vrai correctif du débordement sur la question
   au-dessus : .salAmtWrap ne mesurait que la hauteur du texte (~60px),
   l'anneau (280px, centré dessus en absolute) débordait donc de ~110px
   par-dessus ET par-dessous sans que le flex column (#salaryIntro, gap
   22px) n'en tienne compte. Réserver la même hauteur que l'anneau force
   le gap à s'appliquer par rapport à sa vraie taille visible. */
.salAmtWrap{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;isolation:isolate;min-height:280px;
  transition:min-height .5s var(--ease-slide);}
/* spécificité id : .amt (partagée avec les cartes de dépenses) fixe color:var(--c),
   qui vaudrait sinon la couleur d'encre par défaut ici (pas de --c ambiant) */
/* taille réduite par rapport à l'écran de montant de l'app (64px) : un
   salaire tient souvent sur 4 chiffres ("2000 €"), et l'anneau de
   célébration qui l'entoure a besoin d'un peu de marge tout autour pour ne
   pas le couper */
#salaryInput.salAmt{border:none;background:none;outline:none;font-family:inherit;font-weight:800;font-size:48px;
  color:#cbbf9e;width:1ch;min-width:1ch;text-align:center;caret-color:#2e7d4f;padding:0;
  font-variant-numeric:tabular-nums;transition:color 0.15s;
  position:relative;z-index:2;}
#salaryInput.salAmt::placeholder{color:#cbbf9e;}
/* gris tant qu'aucun chiffre n'est saisi, vert une fois un montant réel entré (voir le
   listener 'input' plus bas), même logique que le montant grisé de l'app (index.html #amountScreenInput) */
.salEur{font-size:48px;font-weight:800;color:#cbbf9e;transition:color 0.15s;position:relative;z-index:2;}
/* anneau de célébration qui vient entourer le montant sans qu'il ne bouge :
   départ à midi, tour complet dans le sens horaire, retour à midi.
   z-index:1 explicite (avec isolation:isolate sur .salAmtWrap ci-dessus) :
   sans ça, un absolute (même placé avant en DOM) peint quand même par-dessus
   le texte statique du montant, qui se retrouvait écrit dessous l'anneau
   au lieu d'au-dessus. */
.salRing{position:absolute;left:50%;top:50%;width:280px;height:280px;z-index:1;
  transform:translate(-50%,-50%) rotate(-90deg);pointer-events:none;}
/* piste vide (réceptacle), visible dès le premier cadre — copie exacte de
   .dTrack sous les .dSeg des pages suivantes, MÊME effet brillant (segGlow),
   pas seulement la couleur : ça fait déjà "joli" avant la moindre saisie,
   au lieu d'un espace nu ou d'un simple trait plat. */
.salRing .dTrack{fill:none;stroke:#e7dfd0;stroke-width:13;filter:url(#segGlow);}
/* épaisseur alignée sur celle du donut des pages suivantes (.donutWrap.big :
   13.5px), effet brillant identique (.dSeg, même filtre #segGlow partagé) */
/* var(--ease-slide), pas ease-out : le remplissage était plus dynamique/rapide
   avec la courbe maison qu'avec un ease-out générique. Cette courbe est très
   avancée en avant (à 40% du temps écoulé, le tracé est déjà à ~92% de son
   parcours visuel, à 63% il est à ~98%) : les confettis ne doivent donc PAS
   attendre transitionend (la vraie fin à 1,1s traîne ~400ms après que
   l'anneau ait l'air fini) mais partir plus tôt, vers 63% du temps — voir
   CONFETTI_DELAY_MS dans revealSalaryDonut. */
.salRing .salProg{fill:none;stroke:#2e7d4f;stroke-width:13;stroke-linecap:butt;filter:url(#segGlow);
  stroke-dasharray:0 100;transition:stroke-dasharray 1.1s var(--ease-slide);}
/* le rond ne s'active qu'au moment du tracé (voir revealSalaryDonut en JS) :
   un tracé de longueur 0 avec un bout arrondi se dessine quand même comme un
   point, visible en permanence tant que rien n'a été saisi */
.salRing .salProg.drawing{stroke-linecap:round;}

/* confettis de la révélation du donut */
.confetti{position:fixed;top:0;left:0;width:8px;height:8px;pointer-events:none;z-index:80;}

/* icône volante : clone flottant qui parcourt le trajet rangée <-> carte (et
   centre de l'écran <-> rangée pour le salaire). Un seul transform
   (translate+scale) porte tout le trajet, voir flyIcon en JS. */
.iconFly{position:fixed;top:0;left:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  z-index:70;pointer-events:none;transform-origin:top left;}
.iconFly svg{width:50%;height:50%;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* scène des cartes : le .stage pilote la hauteur, .card la remplit entièrement (inset:0)
   pour que ce soit bien la carte blanche entière qui grandisse/rétrécisse, pas la pastille du montant */
.stage{position:relative;width:100%;max-width:340px;flex-shrink:0;height:180px;
  transition:height .5s var(--ease-slide),margin-top .5s var(--ease-slide);}
.card{position:absolute;inset:0;background:#fff;border-radius:24px;padding:20px;
  box-shadow:0 10px 30px rgba(61,53,48,0.10);
  transform:translateX(112%);opacity:0;visibility:hidden;
  transition:transform .5s var(--ease-slide),opacity .38s ease,visibility 0s .5s;}
.card.cur{transform:translateX(0);opacity:1;visibility:visible;transition:transform .5s var(--ease-slide),opacity .38s ease;}
.card.past{transform:translateX(-112%);opacity:0;}
/* état initial d'une carte neuve : la carte (donc .stage) est grande et haute, en-tête ancré
   en haut ; la pastille du montant garde sa taille normale, juste centrée verticalement
   dans l'espace restant via une marge auto (n'étire pas sa propre boîte) */
.card.square{display:flex;flex-direction:column;}
.card.square .amtWrap{margin-top:auto;margin-bottom:auto;}
/* La grille de marques (Abonnements) doit remplir tout l'espace vertical
   restant sous l'en-tête, comme la grille "quel jour du mois ?" plus bas
   (même mécanique, voir .dayBlock.show) — la centrer comme .amtWrap (marge
   auto haut/bas) laissait un grand vide blanc sous la rangée qui dépasse,
   au lieu de laisser voir davantage de marques. */
.card.square .brandBlock.show{display:flex;flex-direction:column;flex:1;min-height:0;margin-top:10px;}
.card.square .brandGridWrap{flex:1;min-height:0;}

.cSkip{position:absolute;top:14px;right:16px;width:36px;height:36px;border-radius:50%;
  border:none;background:#f1ebe0;color:var(--sub);
  font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;padding:6px;box-sizing:border-box;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s ease,transform .1s var(--ease-out);}
.cSkip:active{background:#8b6914;transform:scale(0.9);}
.cSkip svg{width:24px;height:17px;stroke:var(--sub);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
  transition:stroke .15s ease;}
.cSkip:active svg{stroke:#fff;}
/* Retour visuel piloté en JS (voir handler du tap) plutôt que le seul :active :
   un tap réel relâche trop vite pour que :active tienne "plus longtemps", et
   :active seul disparaît dès le doigt levé — cette classe reste posée tout le
   temps voulu, indépendamment de la durée réelle du tap. */
.cSkip.pressed{background:#8b6914;animation:cSkipZoom .28s ease;}
.cSkip.pressed svg{stroke:#fff;}
@keyframes cSkipZoom{0%{transform:scale(1);}35%{transform:scale(0.8);}65%{transform:scale(1.1);}100%{transform:scale(1);}}
/* ── bouton Installer l'app (PWA) ── */
/* Gros CTA doré posé DANS le flux de #flow, entre le donut de suivi et la
   carte (.stage) : il participe au layout comme n'importe quel bloc, donc il
   suit naturellement les repositionnements de la carte (clavier, hauteurs de
   carte) sans synchronisation. Masqué en standalone (déjà installée), pendant
   l'écran salaire (voir setCurrent) et après installation. */
.dlWrap{position:relative;width:100%;max-width:340px;flex-shrink:0;margin:2px 0 14px;}
.dlWrap.hid{display:none;}
.dlBtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;
  border:none;border-radius:30px;padding:13px 18px;cursor:pointer;font-family:inherit;text-align:left;
  background:linear-gradient(135deg,#c9a84c,#8b6914);color:#fff;
  box-shadow:0 6px 18px -6px rgba(139,105,20,0.55);
  transition:transform .12s var(--ease-out),box-shadow .2s ease;
  animation:dlPulse 2.2s ease-in-out infinite;}
.dlBtn:active{transform:scale(0.97);animation:none;}
/* pulsation douce : léger gonflement + halo doré qui s'étend puis se dissout,
   même esprit que kkFlagPulse dans l'app — attire l'œil sans clignoter. */
@keyframes dlPulse{
  0%{transform:scale(1);box-shadow:0 6px 18px -6px rgba(139,105,20,0.55),0 0 0 0 rgba(201,168,76,0.45);}
  45%{transform:scale(1.025);box-shadow:0 6px 18px -6px rgba(139,105,20,0.55),0 0 0 12px rgba(201,168,76,0);}
  100%{transform:scale(1);box-shadow:0 6px 18px -6px rgba(139,105,20,0.55),0 0 0 0 rgba(201,168,76,0);}
}
.dlBtn svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.dlBtn .dlT1{font-size:19px;font-weight:800;letter-spacing:-0.3px;line-height:1.15;}
.dlBtn .dlT2{font-size:11.5px;font-weight:600;color:rgba(255,255,255,0.85);margin-top:2px;line-height:1.3;}
.cRow{display:flex;align-items:center;gap:12px;}
.cIcon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cIcon svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.cName{font-size:17px;font-weight:800;}
.cSub{font-size:12.5px;color:var(--sub);font-weight:600;margin-top:1px;}

.amtWrap{display:flex;align-items:baseline;justify-content:center;gap:8px;
  width:max-content;min-width:150px;max-width:100%;margin:10px auto 0;
  background:#f7f1e6;border-radius:16px;padding:6px 16px 7px;
  transition:padding .3s var(--ease-slide),margin .3s var(--ease-slide);}
/* même typo que l'écran de montant de l'app : Inter 800, montant et € à la même taille.
   Carte compacte (clavier ouvert, 150px de haut) : 34px, sinon padding 20 +
   en-tête 44 + marge + pastille débordaient pile sur les 150px et la pastille
   collait au bord bas de la carte, sans blanc. La carte carrée (au repos)
   garde la grande taille via l'override .card.square plus bas. */
.amt{border:none;background:none;outline:none;font-family:inherit;font-weight:800;font-size:34px;
  color:var(--c);width:1ch;min-width:1ch;text-align:center;caret-color:var(--c);padding:0;
  font-variant-numeric:tabular-nums;transition:font-size .3s var(--ease-slide);}
.amt::placeholder{color:color-mix(in srgb,var(--c) 30%,#fff);}
.eur{font-size:34px;font-weight:800;color:var(--c);transition:color .2s ease,font-size .3s var(--ease-slide);}
.card.square .amtWrap{min-width:170px;padding:8px 20px 10px;}
.card.square .amt, .card.square .eur{font-size:42px;}
.amtWrap.empty .eur{color:color-mix(in srgb,var(--c) 30%,#fff);}
/* montant masqué tant que la marque d'abonnement n'est pas choisie */
.amtWrap.hideUntilBrand{display:none;}

/* chips jour du mois / marque d'abonnement / fréquence / jour de semaine
   (même mécanique de révélation) */
.dayBlock, .brandBlock, .freqBlock, .weekdayBlock{margin-top:10px;opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity .35s ease,transform .35s var(--ease-out);}
.dayBlock.show, .brandBlock.show, .freqBlock.show, .weekdayBlock.show{opacity:1;transform:translateY(0);pointer-events:auto;}
/* la grille "quel jour du mois ?" doit occuper tout l'espace vertical
   restant dans la carte blanche (au lieu de rester collée en haut avec du
   vide en dessous) : la carte passe en colonne flex, le bloc jour prend le
   reste de la place, et les 5 rangées de la grille (7 colonnes, comme un
   calendrier) se répartissent uniformément sur toute la hauteur dispo. */
.card.hasDay{display:flex;flex-direction:column;}
.dayBlock.show{display:flex;flex-direction:column;flex:1;min-height:0;}
.chips.dayChips{flex:1;display:grid;grid-template-columns:repeat(7,1fr);align-content:space-between;justify-items:center;align-items:center;}
/* une fois la marque choisie (ou le jour/fréquence non retenu) le bloc doit
   sortir du flux (pas juste s'effacer) : sinon, encore présent en
   display:block malgré opacity:0, il continue à réserver sa hauteur et pousse
   le reste (ex. les puces de jour de semaine) sous la carte, hors de portée */
.brandBlock.gone, .dayBlock.gone, .freqBlock.gone, .weekdayBlock.gone{display:none;}
.dayQ{font-size:13px;font-weight:700;color:#7a6e65;margin-bottom:6px;text-align:center;}
/* écran fréquence : plus d'air au-dessus (entre le rectangle de montant et la
   question) et en-dessous (entre la question et les 3 cartes) que les autres
   blocs de la même mécanique, qui restaient trop collés/centrés. */
.freqBlock{margin-top:26px;}
.freqBlock .dayQ{margin-bottom:16px;}
/* grille des 31 jours resserrée (puces + espacements réduits) pour que la
   carte soit moins haute et que le bouton Continuer reste visible sans
   scroller sur les petits écrans. */
.chips{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;}
.chip{min-width:34px;height:34px;padding:0 7px;border-radius:17px;border:none;background:#f1ebe0;
  font-family:inherit;font-size:14px;font-weight:700;color:#7a6e65;cursor:pointer;
  transition:transform .15s var(--ease-out),background .2s ease,color .2s ease;}
.chip:active{transform:scale(0.92);}
.chip.sel{background:var(--c);color:#fff;}
/* apparition en cascade des puces jour du calendrier ("Quel(s) jour(s) du
   mois ?") au moment où le bloc se révèle — déclenchée en JS (popInDayChips)
   qui (re)pose cette classe + un délai par puce, plutôt qu'une animation CSS
   pure qui tournerait dès le rendu (masqué par le parent opacity:0) au lieu
   de rejouer à chaque apparition du bloc. */
@keyframes dayChipPop{0%{opacity:0;transform:translateY(5px) scale(0.75);}100%{opacity:1;transform:translateY(0) scale(1);}}
.dayChips .chip.pop-in{animation:dayChipPop .3s var(--ease-out) both;}
/* fréquence : 3 cartes carrées identiques (icône calendrier teintée + label),
   plutôt que des puces texte — plus lisible pour un choix aussi structurant.
   Chaque carte a son propre équivalent mensuel affiché juste en-dessous
   (calculé dès l'affichage, pas seulement après sélection) : rien pour
   "plusieurs fois par mois", ça dépend du nombre de jours cochés ensuite. */
.freqCards{display:flex;gap:8px;align-items:flex-start;}
.freqCardWrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;}
.freqCard{position:relative;width:100%;aspect-ratio:1/1;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;gap:7px;background:#f7f2ea;border:none;
  border-radius:20px;padding:16px 4px 8px;cursor:pointer;font-family:inherit;
  transition:background .2s ease,transform .15s var(--ease-out);}
.freqCard:active{transform:scale(0.96);}
.freqCard.sel{background:var(--c);}
.freqCardIcon{width:38px;height:38px;border-radius:12px;flex-shrink:0;
  background:color-mix(in srgb,var(--c) 20%,#fff);display:flex;align-items:center;
  justify-content:center;transition:background .2s ease;}
.freqCard.sel .freqCardIcon{background:rgba(255,255,255,0.22);}
.freqCardIcon svg{width:60%;height:60%;stroke:var(--c);fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s ease;}
.freqCard.sel .freqCardIcon svg{stroke:#fff;}
.freqCardLabel{font-size:12px;font-weight:700;color:#7a6e65;text-align:center;
  line-height:1.25;min-height:30px;display:flex;align-items:center;justify-content:center;transition:color .2s ease;}
.freqCard.sel .freqCardLabel{color:#fff;}
.freqCardCheck{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
  background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,0.18);opacity:0;transform:scale(0.5);
  transition:opacity .2s ease,transform .2s var(--ease-out);}
.freqCard.sel .freqCardCheck{opacity:1;transform:scale(1);}
.freqCardCheck svg{width:12px;height:12px;stroke:var(--c);fill:none;stroke-width:3.2;
  stroke-linecap:round;stroke-linejoin:round;}
.freqCardHint{font-size:10.5px;font-weight:700;color:#a89e95;text-align:center;min-height:13px;}
/* jour(s) de la semaine : cartes (icône check + label), même langage visuel
   que .freqCard, plutôt que les puces texte génériques — 7 chips en une
   seule ligne se lisaient mal en petites pastilles rondes. Pas de badge
   check séparé : la sélection se voit déjà au remplissage coloré de la
   carte, un check en plus était redondant. Le rectangle blanc lui-même
   s'allonge à ce moment-là (voir compactStage('freq') puis compactStage(true)
   dans le handler de clic sur .freqCard) : les jours apparaissent en fondu
   dans l'espace fraîchement ouvert, plutôt que de rester collés en haut
   d'une carte déjà grande. */
/* un peu plus bas que le reveal générique (margin-top:10px, voir plus haut) :
   trop collées au commentaire €/mois du dessus sinon, l'alignement avec les
   3 cartes de fréquence au-dessus paraissait de travers. Puces légèrement
   réduites (aspect-ratio 0.78 -> 0.68) pour laisser respirer cet écart. */
.weekdayBlock{margin-top:20px;}
/* align-items:center (pas le stretch par défaut) : sinon le flex row étire toutes
   les puces à la hauteur de la plus grande, et la puce sélectionnée ne "grandit"
   plus visuellement puisque les autres grandissent avec elle. */
.chips.weekdayChips{flex-wrap:nowrap;gap:6px;align-items:center;}
.chip.weekdayChip{position:relative;flex:1;min-width:0;height:auto;aspect-ratio:1/0.68;padding:0;
  border-radius:14px;background:#fff;border:1.5px solid #ece5d8;display:flex;
  align-items:center;justify-content:center;
  transition:background .2s ease,border-color .2s ease,transform .15s var(--ease-out),aspect-ratio .22s var(--ease-out);}
.chip.weekdayChip:active{transform:scale(0.94);}
.weekdayChipLabel{font-size:12px;font-weight:700;color:var(--c);transition:color .2s ease,background .2s ease;
  padding:2px 8px;border-radius:20px;}
/* sélectionné : grandit en hauteur (pas juste un fond coloré) pour bien voir
   lesquels sont cochés d'un coup d'œil dans la rangée. */
.chip.weekdayChip.sel{background:var(--c);border-color:var(--c);aspect-ratio:1/0.95;}
/* juste le texte en blanc sur le fond déjà coloré de la puce, sans pastille
   translucide derrière (rgba(255,255,255,0.18) + border-radius du label) :
   ça dessinait une deuxième pilule visible par-dessus la première, deux
   couleurs qui se chevauchaient au lieu d'une seule puce pleine. */
.chip.weekdayChip.sel .weekdayChipLabel{color:#fff;}
/* grille des marques d'abonnement : logo + nom + icône "+", façon grille
   d'app store, plutôt que de petites puces texte peu lisibles à cinq.
   Plafonnée en hauteur (9 marques ne tiennent pas sur 2 rangées) : on
   scrolle dedans, avec un fondu haut/bas façon .scroll-fade-wrap (carousel
   de comptes) mais vertical, activé/désactivé dynamiquement selon la
   position de scroll (voir initBrandGridFade). */
.brandGridWrap{position:relative;overflow:visible;}
/* Encore réduit à 5px (après un premier passage à 12px, toujours trop) : la
   rangée qui dépasse doit rester quasiment entière, jusqu'au bord du
   rectangle blanc — le fondu n'est qu'un léger indice de scroll, pas un
   masque qui mange le contenu. */
.brandGridWrap::before,.brandGridWrap::after{content:'';position:absolute;left:0;right:0;height:5px;
  pointer-events:none;z-index:2;opacity:0;transition:opacity .2s;}
.brandGridWrap::before{top:0;background:linear-gradient(to bottom,#fff,rgba(255,255,255,0));}
.brandGridWrap::after{bottom:0;background:linear-gradient(to top,#fff,rgba(255,255,255,0));}
.brandGridWrap.fade-top::before{opacity:1;}
.brandGridWrap.fade-bottom::after{opacity:1;}
.brandGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  /* Remplit toute la hauteur que .brandGridWrap lui laisse (flex:1 sur le
     wrapper et sur .brandBlock.show, voir plus haut) au lieu d'un plafond
     fixe en pixels : un max-height codé en dur (224px) laissait un grand
     vide blanc sous la grille dans une carte plus haute que ça, alors que
     ce même espace pouvait montrer 1-2 marques de plus. Défile pour le
     reste (18 marques ne tiennent jamais toutes), fade-top/fade-bottom
     l'indiquent déjà. */
  height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  /* padding généreux sur les 4 côtés (2px→16px/14px) : la puce sélectionnée grossit
     de 16% au tap (voir .brandChip.pulse) + un halo de 9px — sans cette marge, une
     puce de la 1ère/dernière rangée OU de la 1ère/dernière colonne se faisait couper
     par le bord du conteneur scrollable (haut/bas ET gauche/droite). */
  padding:16px 14px;}
.brandGrid::-webkit-scrollbar{display:none;}
.brandChip{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:10px 6px 8px;border-radius:16px;border:none;background:#f1ebe0;
  font-family:inherit;cursor:pointer;position:relative;min-width:0;height:auto;
  transition:transform .15s var(--ease-out),background .2s ease,opacity .2s ease;}
.brandChip:active{transform:scale(0.94);}
.brandChip img, .brandChip .bLogo{width:38px;height:38px;border-radius:10px;object-fit:contain;flex-shrink:0;}
.brandChip .bName{font-size:11.5px;font-weight:700;color:#3d3530;line-height:1.15;text-align:center;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
/* un abonnement déjà ajouté reste coloré (comme au moment du tap), pas
   juste le dernier sélectionné : .sel est exclusif (retiré de tous les
   autres dès qu'on en choisit un nouveau), donc c'est bien .added qui doit
   porter la couleur pour que TOUS les abonnements déjà ajoutés restent
   visiblement "faits" plutôt que de retomber en beige neutre */
.brandChip.added{background:var(--c);opacity:0.85;pointer-events:none;}
.brandChip.added .bName{color:#fff;}
/* confirmation visuelle au tap : la puce choisie pulse (léger bond + halo de
   sa couleur) avant que le bloc de sélection ne s'efface, sinon .sel passe
   quasi inaperçu (le bloc entier disparaît dans la foulée, voir handler de
   clic plus bas qui retarde ce masquage le temps du pulse). */
.brandChip.pulse{animation:chipPulse .5s var(--ease-out);}
@keyframes chipPulse{
  0%{transform:scale(1);box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 55%,transparent);}
  40%{transform:scale(1.16);box-shadow:0 0 0 9px color-mix(in srgb,var(--c) 0%,transparent);}
  100%{transform:scale(1);box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 0%,transparent);}
}
/* badge check */
.check{position:absolute;bottom:14px;right:16px;width:34px;height:34px;border-radius:50%;
  background:var(--c);display:flex;align-items:center;justify-content:center;
  transform:scale(0.5);opacity:0;transition:transform .35s var(--ease-out),opacity .25s ease;}
.check svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.card.okd .check{transform:scale(1);opacity:1;}
/* validation via le "Suivant" du clavier : le clavier se baisse quand même le
   temps de passer à la carte suivante (voir finishStep), un simple badge en
   coin passerait inaperçu pendant ce trou. Un rond vert centré et agrandi,
   avec des confettis (spawnConfetti), rend ce moment satisfaisant plutôt que
   bancal, et masque la coupure du clavier au lieu de la faire remarquer.
   Le badge normal de la carte reste invisible pendant ce mode : c'est
   #celebrateCheck (voir plus bas) qui prend le relais, un élément à part
   plutôt qu'un enfant de .card, car .card a un transform (le glissement de
   carte) et un position:fixed *interne* à un ancêtre transformé ne rejoint
   jamais le vrai viewport, il reste ancré à cet ancêtre. */
.card.celebrate .check{opacity:0;}

/* badge de validation "celebrate", commun à toutes les cartes : ancré à une
   distance fixe du bas de l'écran (pas mesuré depuis la carte), pour rester
   toujours nettement sous elle, carte carrée/fraîche ou compacte, plutôt que
   dépendre d'une hauteur de #stage qui bouge (fraîche/compacte) et anime sa
   propre transition (mesurer pendant qu'elle tourne encore faisait parfois
   atterrir le badge au milieu de l'écran, par-dessus la carte). */
.celebrateCheck{position:fixed;left:50%;bottom:max(110px,calc(78px + env(safe-area-inset-bottom)));width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;z-index:65;
  opacity:0;pointer-events:none;transform:translateX(-50%) scale(0.4);
  transition:transform .45s var(--ease-slide),opacity .25s ease,width .45s var(--ease-slide),height .45s var(--ease-slide);}
.celebrateCheck svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  transition:width .45s var(--ease-slide),height .45s var(--ease-slide);}
.celebrateCheck.on{opacity:1;}
.celebrateCheck.big{width:96px;height:96px;transform:translateX(-50%) scale(1);}
.celebrateCheck.big svg{width:45px;height:45px;}

/* bouton valider : pillule comme les "Continuer" de l'app, visible dès qu'un montant est saisi */
#valider{margin-top:16px;border:none;width:100%;max-width:340px;padding:17px;border-radius:30px;
  background:#3fa970;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;
  transition:transform .16s var(--ease-out),opacity .25s ease,background .3s ease;flex-shrink:0;}
#valider:active{transform:scale(0.97);}
#valider.off{opacity:0;pointer-events:none;transform:translateY(6px);}
/* étape jour du mois : le bouton est déjà visible (pas de saisie clavier à
   attendre comme pour le montant), mais grisé/désactivé tant qu'aucun jour
   n'est choisi — même gris que le bouton "Continuer" désactivé de l'app. */
#valider.disabled{background:#ece3d2 !important;color:#b9a47e !important;pointer-events:none;}

/* ═══ finale ═══ */
#fin{position:absolute;inset:0;display:flex;flex-direction:column;visibility:hidden;z-index:5;
  /* padding-top : assez pour que #barIcons (les icônes de catégorie, positionnées
     au-dessus de #barWrap) ne soient pas cropées par l'encoche/la barre de statut sur
     un vrai téléphone (c'était le cas à 34px), sans pour autant les redescendre trop
     bas — l'écart avec le haut de l'écran doit rester proche de celui des icônes de
     progression (#dots) sur les autres écrans du parcours (padding-top de #flow :
     10px + safe-area), pas les 70px précédents qui les enfonçaient trop. */
  padding:calc(46px + env(safe-area-inset-top)) 24px calc(16px + env(safe-area-inset-bottom));
  overflow-y:auto;-webkit-overflow-scrolling:touch;}
#fin.on{visibility:visible;}

#finDonutWrap{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
  width:190px;height:190px;opacity:0;
  transition:opacity .4s ease,transform .6s var(--ease-slide),filter .5s ease;}
#finDonutWrap.on{opacity:1;}
#finDonutWrap.morph{opacity:0;transform:translate(-50%,-50%) scale(0.72);filter:blur(6px);}
/* enfant direct (>) : #finSegIcon svg est aussi un descendant de #finDonutWrap
   (finDonutWrap > finPct > finSegIcon > svg) donc un sélecteur non scopé
   appliquait aussi cette rotation à l'icône de catégorie, la faisant
   apparaître pivotée de 90°. Même scope pour la règle des cercles de
   l'anneau juste en dessous : "#finDonutWrap circle" (non scopé) attrapait
   aussi les <circle> DES ICÔNES (rond du billet de salaire, roues du caddie
   et de la voiture, points du calendrier) — à stroke-width:15 dans leur
   viewBox de 24 unités, chaque petit cercle devenait un énorme disque blanc
   qui recouvrait l'icône (le "blob" blanc au centre du donut, capture
   utilisateur à l'appui ; house/tv/bag/plate, sans cercle, étaient épargnées
   d'où un bug en apparence aléatoire selon la catégorie). */
#finDonutWrap > svg{width:100%;height:100%;transform:rotate(-90deg);}
#finDonutWrap > svg circle{fill:none;stroke-width:15;}
/* réceptacle : anneau plein toujours visible, sinon les parts colorées
   semblaient se remplir "dans le vide" sans contour de référence. */
.finTrack{stroke:#ece5d8;}
/* même effet brillant que le donut de saisie (.dSeg) et l'anneau du salaire
   (.salProg), pas le rendu plat de base — voir le filtre #segGlow. */
#finSegs circle{stroke-linecap:butt;filter:url(#segGlow);}
#finPct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-size:26px;font-weight:900;color:#141110;font-variant-numeric:tabular-nums;}
/* icône de la catégorie en cours de remplissage : change en fondu à chaque
   part suivante, synchronisé sur le même délai que le tracé de cette part. */
#finSegIcon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .18s ease;}
#finSegIcon svg{width:55%;height:55%;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* barre de budget : reprend exactement .money-progress-track/.money-seg de la
   page Calendrier de l'app (pilule beige, segments sans arrondi sauf aux
   extrémités, fin séparateur clair entre segments). Un seul élément qui
   voyage du centre de l'écran vers son emplacement final dans la carte. */
#barWrap{position:relative;width:100%;margin-top:24px;}
#barIcons{position:absolute;left:0;right:0;bottom:calc(100% + 8px);height:26px;pointer-events:none;}
.barIcon{position:absolute;top:0;width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;transform:translateX(-50%);
  box-shadow:0 1px 4px rgba(0,0,0,0.18);opacity:0;transition:opacity .3s ease,left .25s var(--ease-slide);}
.barIcon.in{opacity:1;}
.barIcon svg{width:60%;height:60%;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
#bar{display:flex;height:42px;border-radius:21px;overflow:hidden;width:100%;
  background:#f0ebe2;box-shadow:inset 0 1px 3px rgba(61,53,48,0.08);
  opacity:0;transition:transform .65s var(--ease-slide),opacity .4s ease;}
#bar.on{opacity:1;}
#bar div{height:100%;}
#bar div+div{box-shadow:inset 1px 0 rgba(255,255,255,0.55);}

/* récap chiffré au-dessus du calendrier : charges totales à gauche, épargne
   restante à droite (vert clair, comme un solde positif), chacune avec son
   montant et sa part du salaire. Même carte blanche que .calBox/.recapBox. */
.finSummary{display:flex;background:#fff;border-radius:22px;box-shadow:0 1px 4px rgba(0,0,0,0.05);margin-top:12px;}
.finSummary .stat{flex:1;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;}
.finSummary .stat+.stat{border-left:1px solid #f1ebe0;}
.finSummary .statLbl{font-size:10.5px;font-weight:700;color:#a89e95;text-transform:uppercase;letter-spacing:0.03em;text-align:center;}
.finSummary .statAmt{font-size:19px;font-weight:800;color:#8b2020;font-variant-numeric:tabular-nums;}
.finSummary .statPct{font-size:11.5px;font-weight:700;color:#8b2020;}
.finSummary .stat.savings .statAmt,.finSummary .stat.savings .statPct{color:#3a6b4a;}

/* contenu calendrier : même carte (.budget-month-card) et même grille
   (renderUpcomingCalGrid) que la page Calendrier — rectangle blanc, cases
   arrondies, badges d'icônes empilés (chips 4px, pas des ronds), montant du
   jour (+/-, même convention couleur que l'app) toujours collé en bas de la
   case, même quand il n'y a pas d'icône au-dessus. */
.calBox{background:#fff;border-radius:22px;padding:14px 14px 16px;box-shadow:0 1px 4px rgba(0,0,0,0.05);margin-top:12px;}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.calHead{font-size:12px;font-weight:700;color:#a89e95;text-align:center;padding-bottom:4px;}
.calDay{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  gap:2px;padding:5px 2px;border-radius:8px;position:relative;}
.calDayTop{display:flex;flex-direction:column;align-items:center;gap:3px;}
.calDayNum{font-size:10.5px;font-weight:500;color:#3d3530;font-variant-numeric:tabular-nums;}
.calDay.today{box-shadow:inset 0 0 0 2px rgba(201,168,76,0.75);}
.calDay.today .calDayNum{font-weight:700;}
.calBadges{position:relative;height:18px;}
.calBadge{position:absolute;top:0;width:18px;height:18px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(0.4);
  transition:opacity .35s var(--ease-out),transform .35s var(--ease-out);}
.calBadge.in{opacity:1;transform:scale(1);}
.calBadge svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
.calDayAmt{min-height:9px;line-height:1;font-size:7.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* récap des postes sous le calendrier : même carte blanche que .calBox,
   une ligne par poste (icône/logo, nom, montant) */
.recapBox{background:#fff;border-radius:22px;padding:6px 16px;box-shadow:0 1px 4px rgba(0,0,0,0.05);margin-top:12px;}
.recapRow{padding:10px 0;}
.recapRow+.recapRow{border-top:1px solid #f1ebe0;}
.recapTop{display:flex;align-items:center;gap:12px;}
.recapIcon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.recapIcon svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.recapIcon img, .recapIcon .brandIconEl{width:32px;height:32px;border-radius:50%;}
.recapName{flex:1;font-size:14.5px;font-weight:700;color:var(--ink);}
.recapAmtCol{display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
.recapAmt{font-size:14.5px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;}
/* part du salaire de CE poste (montant/salaire, même dénominateur que
   chargesPct plus haut) : couleur de la catégorie, pas de l'encre neutre —
   c'est elle qui relie visuellement le chiffre à sa part sur le donut/la
   barre juste au-dessus. */
.recapPct{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;}
/* Barre de proportion sous chaque poste, en plus du %, alignée sur le
   texte (44px = largeur icône 32px + gap 12px) plutôt que sous l'icône. */
.recapBarTrack{height:7px;background:#f1ebe0;border-radius:4px;margin:7px 0 0 44px;overflow:hidden;}
.recapBarFill{height:100%;border-radius:4px;width:0;transition:width .6s var(--ease-out);}
.recapMore{text-align:center;padding:9px 0 10px;font-size:15px;font-weight:800;color:#b5aa9d;letter-spacing:1px;}
/* même bouton "Continuer" brun arrondi que le reste de l'app (voir #valider
   ci-dessus) : margin-top fixe (pas auto) pour garantir un espace avec le
   récap au-dessus même quand le contenu remplit tout l'écran. */
#cta{margin-top:20px;flex-shrink:0;border:none;border-radius:30px;background:#8a6d3b;color:#fff;
  font-family:inherit;font-size:16px;font-weight:700;padding:17px 22px;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  transition:transform .16s var(--ease-out);}
#cta:active{transform:scale(0.97);}
/* flèche poussée à droite du bouton (justify-content:space-between ci-dessus)
   et agrandie par rapport au texte, comme demandé */
#ctaArrow{font-size:22px;font-weight:800;line-height:1;}

/* apparition en cascade du contenu finale */
.pre{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s var(--ease-out);}
.pre.in{opacity:1;transform:translateY(0);}
</style>
</head>
<body>
<!-- filtre de brillance réutilisé sur les segments remplis du donut de saisie
     (voir .dSeg) : flou doux + calque net superposé, pour un halo de lumière
     sans "faux volume" (ombres portées, dégradé de piste). -->
<svg width="0" height="0" style="position:absolute;">
  <defs>
    <filter id="segGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
<div class="app">

  <div id="welcomeScreen">
    <img class="pre" src="icons/icon-192.png" alt="">
    <div class="welcomeTitle pre" id="welcomeTitle"></div>

  <div id="flow">

    <div class="donutWrap hidden">

        <svg class="salRing" viewBox="0 0 120 120">

          <circle class="salProg" cx="60" cy="60" r="50" pathLength="100"/>
        </svg>
        <input id="salaryInput" class="salAmt amt" type="text" inputmode="decimal" enterkeyhint="next" placeholder="0" autocomplete="off"><span class="salEur">€</span>
        <div id="salaryTransition" class="gone">
          <div class="salQ pre" id="salaryTransitionMsg"></div>
        </div>
      </div>
    </div>
    <div class="dlWrap hid" id="dlWrap">
      <button class="dlBtn" id="dlBtn" ontouchstart="">
        <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        <span><span class="dlT1">Installer l'app</span><br><span class="dlT2">Gère ton budget et suis ton patrimoine</span></span>
      </button>
    </div>
    <div class="stage" id="stage"></div>
    <div class="celebrateCheck" id="celebrateCheck"></div>
    <button id="valider">Valider</button>
  </div>

  <div id="fin">
    <div id="finDonutWrap">
      <svg viewBox="0 0 120 120">
        <circle class="finTrack" cx="60" cy="60" r="50" pathLength="100"/>
        <g id="finSegs"></g>

      <div id="finPct"><div id="finSegIcon"></div><div id="finPctAmt">0 €</div></div>
    </div>

      <div id="barIcons"></div>
      <div id="bar"></div>
    </div>

      <div class="calGrid" id="calGrid"></div>
    </div>
    <div class="recapBox pre" id="recapBox"></div>
    <button id="cta" class="pre"><span>Voir mon budget</span><span id="ctaArrow">→</span></button>
    <!-- Zone invisible sous le CTA : lance la démo (?demo=1). Volontairement
         indétectable pour un vrai visiteur — pas de texte, pas de curseur,
         juste un pavé tapable de la même hauteur que le bouton juste au-dessus
         (hauteur posée en JS, voir plus bas — plus simple à retrouver à la
         volée qu'une valeur fixe qui ne correspond à rien de visible). -->
    <div id="ctaDemo" style="flex-shrink:0;"></div>
  </div>

</div>
<script>
'use strict';

/* ── Langue : kk_lang (préférence app) sinon langue du téléphone — même
   mécanique que onboarding.html : tout téléphone non francophone voit
   l'onboarding en anglais. ── */
const _savedLang=(()=>{try{return window.localStorage.getItem('kk_lang');}catch(e){return null;}})();
const LANG=_savedLang||(((navigator.language||'fr').toLowerCase().indexOf('fr')===0)?'fr':'en');
document.documentElement.lang=LANG;
const t=(fr,en)=>LANG==='fr'?fr:en;

/* ── Funnel onboarding : chaque étape atteinte est envoyée (une seule fois
   par session, dédup client + contrainte unique côté table) dans Supabase
   onboarding_events, que le tableau de bord admin agrège en funnel. Purement
   best-effort : jamais bloquant, silencieux si offline/adblock. La session
   vit en sessionStorage pour qu'un simple reload ne recompte pas l'entrée. ── */
const OB_SUPA_URL='https://ooyhuniazpbdqyzivwyp.supabase.co';
const OB_SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9veWh1bmlhenBiZHF5eml2d3lwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyMzU1NjYsImV4cCI6MjA5ODgxMTU2Nn0.Fz6UXf2VMPDJwXkjEIcU6j-lMcQiqjuYMSunHL70jHI';
const OB_SID=(()=>{
  const gen=()=> (window.crypto&&crypto.randomUUID) ? crypto.randomUUID()
    : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);});
  try{
    let s=sessionStorage.getItem('kk_onb_sid');
    if(!s){ s=gen(); sessionStorage.setItem('kk_onb_sid',s); }
    return s;
  }catch(e){ return gen(); }
})();
const _obSent={};
function obTrack(step, idx){
  if(_obSent[step]) return; _obSent[step]=1;
  try{
    // Pas de Prefer:resolution=ignore-duplicates : ON CONFLICT sous RLS le
    // refuse (42501). Un doublon (retour arrière, reload) prend un 409 sur la
    // contrainte unique (session_id, step), qu'on ignore : même résultat.
    fetch(OB_SUPA_URL+'/rest/v1/onboarding_events',{
      method:'POST', keepalive:true,
      headers:{'Content-Type':'application/json', apikey:OB_SUPA_KEY,
        Authorization:'Bearer '+OB_SUPA_KEY, Prefer:'return=minimal'},
      body:JSON.stringify({session_id:OB_SID, step:step, step_index:idx, lang:LANG})
    }).catch(()=>{});
  }catch(e){}
}

/* ── icônes (traits blancs, style storyboard) ── */
// tailles inline (%) calibrées à l'œil pour un poids visuel homogène entre
// icônes : chaque dessin remplit différemment son viewBox 24x24 (ex. bag/
// plate touchent presque les bords, house/cart laissent de la marge), donc
// un même % pour tous les rendrait visiblement inégaux — c'était le cas de
// bag/plate (sans style perso, donc réduits par défaut au % du conteneur,
// ex. #finSegIcon svg{width:55%}), nettement plus petits/fins que les autres
// une fois affichés côte à côte (donut final, icônes de catégorie qui
// défilent) : recalibrés à 70% pour matcher le poids visuel du reste.
const IC = {
  house:'<svg viewBox="0 0 24 24" style="width:62%;height:62%;"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/></svg>',
  cart:'<svg viewBox="0 0 24 24" style="width:58%;height:58%;"><circle cx="9" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/><path d="M3 4h2.5l2.2 11h10.6l2-8H6"/></svg>',
  tv:'<svg viewBox="0 0 24 24" style="width:75%;height:75%;"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="M9 21h6"/></svg>',
  bolt:'<svg viewBox="0 0 24 24"><path d="M13 2 5 13.5h6L10.5 22 19 10h-6L13 2z"/></svg>',
  car:'<svg viewBox="0 0 24 24" style="width:63%;height:63%;"><path d="M4 12.75 5.8 7.05A2 2 0 0 1 7.7 5.65h8.6a2 2 0 0 1 1.9 1.4L20 12.75"/><rect x="3" y="11.75" width="18" height="5" rx="1.6"/><circle cx="7.3" cy="17.05" r="1.3"/><circle cx="16.7" cy="17.05" r="1.3"/></svg>',
  cash:'<svg viewBox="0 0 24 24" style="width:75%;height:75%;"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6.2 12h.01M17.8 12h.01"/></svg>',
  bag:'<svg viewBox="0 0 24 24" style="width:70%;height:70%;"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>',
  plate:'<svg viewBox="0 0 24 24" style="width:70%;height:70%;"><path d="M3 2v7a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6a2 2 0 0 0 2 2h3ZM21 15v7"/></svg>',
  calendar:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/><circle cx="8" cy="15" r="1.1"/><circle cx="12" cy="15" r="1.1"/><circle cx="16" cy="15" r="1.1"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></svg>'
};

/* vrais logos Kakeibo (mêmes fichiers que EXPENSE_LOGOS dans index.html) pour
   les marques d'abonnement qu'on a en stock ; les autres (ex. Spotify, pas
   d'asset local) retombent sur une pastille colorée à l'initiale plutôt que
   sur l'icône générique de la catégorie, pour rester identifiable dans la
   grille au même titre que les vrais logos. */
const BRAND_LOGOS = {
  'Netflix':      {file:'icons/netflix.webp',      dark:true},
  'Disney+':      {file:'icons/disneyplus.webp',   dark:false},
  'Prime Video':  {file:'icons/primevideo.webp',   dark:false},
  'Basic Fit':    {file:'icons/basicfit.webp',      dark:false},
  'Fitness Park': {file:'icons/fitnesspark.webp',   dark:false},
  'Spotify':      {file:'icons/spotify.jpg',        dark:true},
  'YouTube Premium':{file:'icons/youtubepremium.jpg',dark:false},
  'Apple Music':  {file:'icons/applemusic.jpg',     dark:false},
  'Deezer':       {file:'icons/deezer.jpg',         dark:true},
  'Amazon Prime':     {file:'icons/amazon-prime.png',      dark:false},
  'PlayStation Plus': {file:'icons/playstation-plus.png',  dark:false},
  'Xbox Game Pass':   {file:'icons/xbox-game-pass.png',    dark:false},
  'iCloud+':          {file:'icons/icloud.png',            dark:false},
  'Google One':       {file:'icons/google-one.png',        dark:false},
  'Microsoft 365':    {file:'icons/microsoft-365.png',     dark:false},
  'Crunchyroll':      {file:'icons/crunchyroll.png',       dark:false},
  'Twitch':           {file:'icons/twitch.png',            dark:false},
  'ChatGPT Plus':     {file:'icons/chatgpt.webp',           dark:false}
};
const BRAND_FALLBACK_COLORS = {};
/* prix de base (France, tarif individuel standard) : évite de faire taper un
   montant pour un abonnement, dont le prix est connu et rarement négocié. */
const BRAND_PRICES = {
  'Netflix':        14.99,
  'Spotify':        12.14,
  'Disney+':        10.99,
  'Prime Video':     6.99,
  'YouTube Premium':12.99,
  'Apple Music':    10.99,
  'Basic Fit':      24.99,
  'Fitness Park':   30,
  'Deezer':         11.99,
  'Amazon Prime':     6.99,
  'PlayStation Plus': 8.99,
  'Xbox Game Pass':  14.99,
  'iCloud+':          2.99,
  'Google One':       1.99,
  'Microsoft 365':    7.00,
  'Crunchyroll':      6.49,
  'Twitch':           5.99,
  'ChatGPT Plus':    23.00
};
function brandIconHtml(brand, size, fallback){
  const l = BRAND_LOGOS[brand];
  if(l) return '<img src="'+l.file+'" alt="" style="width:'+size+'px;height:'+size+'px;border-radius:6px;object-fit:contain;background:'+(l.dark?'#000':'#fff')+';padding:2px;">';
  const c = BRAND_FALLBACK_COLORS[brand];
  if(c) return '<span class="bLogo" style="background:'+c+';color:#fff;display:inline-flex;align-items:center;justify-content:center;'+
    'font-weight:800;font-family:inherit;font-size:'+Math.round(size*0.5)+'px;width:'+size+'px;height:'+size+'px;">'+brand[0]+'</span>';
  return fallback||'';
}

const CATS = [
  {id:'salary',    name:t('Salaire','Salary'),      sub:t('Montant mensuel net','Net monthly amount'), color:'#2e7d4f', icon:IC.cash, isIncome:true},
  {id:'rent',      name:t('Loyer','Rent'),        sub:t('Montant mensuel','Monthly amount'), color:'#8b6914', icon:IC.house, askDay:true},
  {id:'subs',      name:t('Abonnements','Subscriptions'),  sub:t('Montant mensuel','Monthly amount'), color:'#8b7cf6', icon:IC.tv, askDay:true,
    pickBrand:true, brands:['Netflix','Spotify','Disney+','Prime Video','YouTube Premium','Apple Music','Basic Fit','Fitness Park','Deezer',
      'Amazon Prime','PlayStation Plus','Xbox Game Pass','iCloud+','Google One','Microsoft 365','Crunchyroll','Twitch','ChatGPT Plus']},
  {id:'transport', name:'Transport',    sub:t('Budget par mois','Monthly budget'), color:'#0055a4', icon:IC.car, askFreq:true},
  {id:'groceries', name:t('Courses','Groceries'),      sub:t('Budget par mois','Monthly budget'), color:'#1fa896', icon:IC.cart, askFreq:true},
  {id:'restaurant',name:'Restaurant',   sub:t('Budget par mois','Monthly budget'), color:'#c96a4e', icon:IC.plate, askFreq:true},
  {id:'shopping',  name:'Shopping',     sub:t('Budget par mois','Monthly budget'), color:'#a8639e', icon:IC.bag, askFreq:true}
];
const DAYS = Array.from({length:31},(_,i)=>i+1);
// fréquence : 'monthly' redirige vers le même calendrier DAYS (jour du mois,
// sélection unique), 'weekly' vers WEEKDAYS (jour de semaine, lundi=0),
// 'multi' vers le même calendrier DAYS mais en sélection multiple (voir
// finale() : chaque jour coché devient une occurrence distincte du mois).
const FREQS = [
  {id:'monthly',  label:t('1 fois par mois','Once a month')},
  {id:'weekly',   label:t('Chaque semaine','Every week')},
  {id:'multi',    label:t('Plusieurs fois par mois','Several times a month')}
];
const WEEKDAYS = LANG==='fr' ? ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche']
  : ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const N = CATS.length;

/* ── état ── */
let cur = 0;                       // index de la carte courante
let phase = 'amount';              // 'amount' | 'day' | 'locked'
let salary = 0;                    // dénominateur du donut (carte 1)
let editReturn = null;             // {index,phase} : carte à retrouver après une édition via les icônes
let flyingDot = null;              // index de la pastille actuellement "en vol"/posée sur la carte
const results = [];                // {cat, amount, day}

/* ── construction du DOM ── */
const dots = document.getElementById('dots');
const segs = document.getElementById('segs');
const stage = document.getElementById('stage');
CATS.forEach((c,i)=>{
  const d = document.createElement('div');
  d.className = 'dot pending'; d.style.setProperty('--c', c.color); d.innerHTML = c.icon;
  dots.appendChild(d);

  const s = document.createElementNS('http://www.w3.org/2000/svg','circle');
  s.setAttribute('class','dSeg'); s.setAttribute('cx',60); s.setAttribute('cy',60);
  s.setAttribute('r',50); s.setAttribute('pathLength',100);
  s.setAttribute('stroke', c.color);
  segs.appendChild(s);

  const card = document.createElement('div');
  card.className = 'card'+(c.isIncome?' salaryCard':''); card.style.setProperty('--c', c.color);
  card.innerHTML = c.isIncome ? '' :
    '<button class="cSkip" aria-label="'+t('Passer','Skip')+'" ontouchstart="">'+
      '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>'+
    '<div class="cRow"><div class="cIcon" style="background:'+c.color+'">'+c.icon+'</div>'+
    '<div><div class="cName">'+c.name+'</div><div class="cSub">'+c.sub+'</div></div></div>'+
    (c.pickBrand
      ? '<div class="brandBlock show"><div class="brandGridWrap"><div class="chips brandGrid">'+
        c.brands.map(b=>'<button class="chip brandChip" data-b="'+b+'">'+brandIconHtml(b,38)+
          '<span class="bName">'+b+'</span></button>').join('')+
        '</div></div>'+
        '</div>'
      : '')+
    '<div class="amtWrap empty'+(c.pickBrand?' hideUntilBrand':'')+'"><input class="amt" type="text" inputmode="decimal" enterkeyhint="next" placeholder="0" autocomplete="off" style="width:1ch"><span class="eur">€</span></div>'+
    (c.askDay
      // gone pour pickBrand (Abonnements) seulement : sans ça ce dayBlock, encore
      // invisible (opacity:0) mais toujours display:block/flex, se met à rivaliser
      // avec brandBlock (flex:1, voir .card.square .brandBlock.show plus haut) pour
      // la hauteur de la carte carrée — la grille de marques ne récupérait quasiment
      // aucun espace en plus. Retiré à la sélection d'une marque (voir plus bas).
      ? '<div class="dayBlock'+(c.pickBrand?' gone':'')+'"><div class="dayQ">'+t('Quel jour du mois ?','Which day of the month?')+'</div><div class="chips dayChips">'+
        DAYS.map(d=>'<button class="chip" data-d="'+d+'">'+d+'</button>').join('')+
        '</div></div>'
      : '')+
    (c.askFreq
      ? '<div class="freqBlock"><div class="dayQ">'+t('À quelle fréquence ?','How often?')+'</div><div class="freqCards">'+
        FREQS.map(f=>'<div class="freqCardWrap"><button class="freqCard" data-freq="'+f.id+'">'+
          '<span class="freqCardCheck">'+IC.check+'</span>'+
          '<span class="freqCardIcon">'+IC.calendar+'</span>'+
          '<span class="freqCardLabel">'+f.label+'</span></button>'+
          '<span class="freqCardHint"></span></div>').join('')+
        '</div></div>'+
        '<div class="dayBlock gone"><div class="dayQ">'+t('Quel jour du mois ?','Which day of the month?')+'</div><div class="chips dayChips">'+
        DAYS.map(d=>'<button class="chip" data-d="'+d+'">'+d+'</button>').join('')+
        '</div></div>'+
        '<div class="weekdayBlock gone"><div class="chips weekdayChips">'+
        WEEKDAYS.map((w,i)=>'<button class="chip weekdayChip" data-w="'+i+'"><span class="weekdayChipCheck">'+IC.check+'</span>'+
          '<span class="weekdayChipLabel">'+w.slice(0,3)+'</span></button>').join('')+
        '</div></div>'
      : '')+
    '<div class="check">'+IC.check+'</div>';
  stage.appendChild(card);
});
// .card explicitement (pas stage.children) : garde-fou pour que tout élément
// non-carte ajouté un jour dans #stage ne soit pas indexé comme une catégorie.

/* fondu haut/bas de la grille de marques, actif seulement quand il reste du
   contenu à scroller dans cette direction (mêmes calculs que initScrollFade
   dans index.html pour le carousel de comptes, transposés en vertical). */
function initBrandGridFade(gridEl){
  if(!gridEl) return;
  const wrap = gridEl.parentElement;
  if(!wrap || !wrap.classList.contains('brandGridWrap')) return;
  const update = () => {
    const atTop = gridEl.scrollTop <= 2;
    const atBottom = gridEl.scrollTop + gridEl.clientHeight >= gridEl.scrollHeight - 2;
    wrap.classList.toggle('fade-top', !atTop);
    wrap.classList.toggle('fade-bottom', !atBottom && gridEl.scrollHeight > gridEl.clientHeight);
  };
  gridEl.addEventListener('scroll', update, {passive:true});
  update();
}

/* fondu d'entrée/sortie franc (pas instantané) pour les écrans texte pleine
   page de l'étape salaire (question initiale, puis message de transition) */
// stagger : soit un nombre (délai uniforme entre chaque enfant, comportement
// d'origine), soit un tableau de délais en ms (un par enfant, dans l'ordre du
// DOM) pour faire apparaître certains enfants ensemble (délai identique).
function fadeInScreen(el, stagger){
  el.classList.remove('gone');
  const kids = [...el.querySelectorAll(':scope > .pre')];
  kids.forEach(k=>k.classList.remove('in'));
  void el.offsetHeight;
  const delayOf = Array.isArray(stagger) ? (i=>stagger[i]??0) : (i=>i*(stagger||500));
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    kids.forEach((k,i)=>setTimeout(()=>k.classList.add('in'), delayOf(i)));
  }));
}
function fadeOutScreen(el, cb){
  el.querySelectorAll(':scope > .pre').forEach(k=>k.classList.remove('in'));
  setTimeout(()=>{ el.classList.add('gone'); if(cb) cb(); }, 550);
}

/* ── helpers ── */
// le salaire se tape dans l'écran d'intro, pas dans une carte
const inputOf = i => i===0 ? salaryInput : cards[i].querySelector('.amt');
// une carte à choix de marque (Abonnements) démarre en phase 'brand' tant
// qu'aucune marque n'a été choisie (déductible de l'état du DOM, pas besoin
// d'état séparé : la classe hideUntilBrand ne part qu'une fois choisie)
const startPhase = i => (CATS[i].pickBrand && cards[i].querySelector('.amtWrap').classList.contains('hideUntilBrand')) ? 'brand' : 'amount';
// tous les jours du mois en cours (numéro 1..nDays) correspondant à un jour de
// semaine donné (0=lundi..6=dimanche) — sert à compter les occurrences réelles
// d'un poste "chaque semaine" et à le placer dans le calendrier final.
function weekdayDaysInMonth(weekday){
  const now = new Date();
  const nDays = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const out = [];
  for(let d=1; d<=nDays; d++){ if(((new Date(now.getFullYear(),now.getMonth(),d).getDay())+6)%7 === weekday) out.push(d); }
  return out;
}
// Nombre d'occurrences réelles ce mois-ci d'un poste "chaque semaine" (jours
// de semaine cochés × leurs répétitions dans le mois) ou "plusieurs fois par
// mois" (nombre de jours cochés) — sert à RÉPARTIR le budget mensuel sur le
// calendrier, pas à le multiplier (voir monthlyAmount ci-dessous).
function occurrenceCount(r){
  return r.freq==='weekly' ? (r.weekdays||[]).reduce((s,wd)=>s+weekdayDaysInMonth(wd).length,0)
    : r.freq==='multi' ? (r.days||[]).length
    : 1;
}
// Le montant saisi est TOUJOURS un budget mensuel (voir le sous-titre "Budget
// par mois"), quelle que soit la fréquence choisie : "chaque semaine" et
// "plusieurs fois par mois" ne changent jamais ce total, ils déterminent
// seulement comment il se répartit sur le calendrier (voir perOccurrenceAmount).
// Avant, "chaque semaine" multipliait le montant par le nombre d'occurrences
// (comme si le montant saisi était "celui de chaque fois") — contradictoire
// avec le sous-titre et avec "plusieurs fois par mois", qui lui divisait déjà
// correctement : les deux fréquences à occurrences multiples doivent se
// comporter pareil.
function monthlyAmount(r){
  return r.amount;
}
// montant posé sur CHAQUE jour du calendrier : le budget mensuel réparti sur
// le nombre d'occurrences réelles (1 pour "1 fois par mois", donc inchangé).
function perOccurrenceAmount(r){
  return r.amount/Math.max(1,occurrenceCount(r));
}
const parseAmt = v => { const n = parseFloat(String(v).replace(',','.').replace(/[^\d.]/g,'')); return isNaN(n)?0:n; };

/* repeint tous les segments : parts = montant/salaire, posées bout à bout.
   liveIdx/liveAmt = saisie en cours (avant validation). Retourne le total engagé. */
function paintSegs(liveIdx, liveAmt){
  let acc = 0;
  CATS.forEach((c,i)=>{
    if(c.isIncome) return;
    let len = 0;
    if(salary > 0){
      if(results[i]){
        // un résultat "Abonnements" est {cat, subs:[...]} plutôt que {cat, amount} ;
        // voir monthlyAmount pour "chaque semaine"/"plusieurs fois par mois".
        const amt = results[i].subs ? results[i].subs.reduce((s,x)=>s+x.amount,0) : monthlyAmount(results[i]);
        len = amt/salary*100;
      }
      else if(i === liveIdx && liveAmt){ len = liveAmt/salary*100; }
    }
    len = Math.max(0, Math.min(len, 100-acc));
    segEls[i].style.strokeDasharray = len+' '+(100-len);
    segEls[i].style.strokeDashoffset = -acc;
    /* un tracé de longueur 0 avec un bout arrondi se dessine quand même
       comme un point : le rond ne doit s'activer qu'une fois le segment
       réellement visible, sinon toutes les catégories encore à 0€ empilent
       un point à la pointe du segment en cours */
    segEls[i].style.strokeLinecap = len > 0 ? 'round' : 'butt';
    acc += len;
  });
  return acc;
}

/* somme brute engagée (en €, pas en %) : même parcours que paintSegs mais
   sans conversion en pourcentage ni plafond à 100, pour connaître le vrai
   reste (qui peut devenir négatif si les dépenses dépassent le salaire). */
function totalEngaged(liveIdx, liveAmt){
  let sum = 0;
  CATS.forEach((c,i)=>{
    if(c.isIncome) return;
    if(results[i]){
      sum += results[i].subs ? results[i].subs.reduce((s,x)=>s+x.amount,0) : monthlyAmount(results[i]);
    } else if(i === liveIdx && liveAmt){ sum += liveAmt; }
  });
  return sum;
}
const fmtRemaining = v => Math.round(v).toLocaleString(LANG==='fr'?'fr-FR':'en-US')+' €';

/* taille du montant restant : suit la même échelle petit/grand que l'anneau
   (.donutWrap.big), rétrécie encore si le nombre a beaucoup de chiffres. Une
   taille fixe posée en JS écraserait sinon en permanence la règle CSS
   ".donutWrap.big .dPct" (le style inline gagne toujours sur une classe), donc
   c'est ici, et non plus dans la CSS seule, qu'on doit retrancher les deux. */
function sizePctText(){
  const big = donutWrap.classList.contains('big');
  const base = big ? 34 : 28;
  const len = String(Math.round(Math.abs(parseFloat(pctEl.dataset.val)||0))).length;
  /* rétrécissement plus marqué qu'avant (0.75/0.55 -> 0.68/0.5) : à partir de
     4-5 chiffres (fréquent avec le signe négatif + "restant", ex. "-10 345 €"),
     le montant touchait presque les bords de l'anneau une fois celui-ci
     agrandi (104 -> 172px) sans que ce palier ne suive. */
  pctEl.style.fontSize = (len>=6?Math.round(base*0.5):len>=4?Math.round(base*0.68):base)+'px';
}
/* vert par défaut, orange dès la moitié du salaire engagée, rouge quand il
   ne reste plus que 10 % (ou moins, dépenses > salaire). */
function pctColor(remaining){
  if(salary<=0) return '#2e7d4f';
  const pctLeft = remaining/salary*100;
  if(pctLeft<=10) return '#c05050';
  if(pctLeft<=50) return '#c9822c';
  return '#2e7d4f';
}

/* ── chorégraphie icône rangée <-> carte ──
   L'icône de la catégorie actuellement "en jeu" (sur la carte, ou le gros
   logo salaire au tout début) n'existe qu'à un seul endroit à la fois :
   soit dans la rangée du haut, soit sur l'écran actif. Un clone flottant
   fait le trajet visuel entre les deux ; pendant le vol, le point de départ
   réel a déjà disparu et celui d'arrivée n'apparaît qu'à l'atterrissage. */

/* clone flottant qui parcourt fromRect -> toRect en un seul transform
   (translate+scale), façon "shared element transition". Trois options
   partagées par tous les appels (retour dans la rangée, départ vers une
   carte, arrivée du salaire) pour ne pas réécrire le même filet de sécurité
   à chaque site d'appel :
   - noScale : le clone garde la taille d'arrivée dès le départ (centré sur
     le point de départ), seule la position bouge — pas de zoom "sur place".
   - restOpacity : une fois arrivé et IMMOBILE, une pause (holdMs, "un peu
     après", jamais pendant le déplacement) puis une 2e animation, séparée,
     atténue le clone jusqu'à cette opacité. Une seule chose bouge à la fois.
   - landEl/hideClass : à l'atterrissage, la vraie pastille prend le relais
     par un remplacement SEC (transition:none) à l'opacité où le clone
     vient de s'arrêter — jamais via la transition normale du .dot, qui
     repartirait de son état masqué et rejouerait un fondu après coup. */
function flyIcon(fromRect, toRect, color, iconHtml, duration, opts){
  opts = opts || {};
  const {noScale, restOpacity, holdMs=120, fadeMs=220, landEl, hideClass, onLand, trackEl,
    easing='cubic-bezier(0.32,0.72,0,1)'} = opts;
  const el = document.createElement('div');
  el.className = 'iconFly';
  el.style.background = color;
  const w = noScale ? toRect.width : fromRect.width;
  const h = noScale ? toRect.height : fromRect.height;
  const startLeft = noScale ? fromRect.left+(fromRect.width-w)/2 : fromRect.left;
  const startTop = noScale ? fromRect.top+(fromRect.height-h)/2 : fromRect.top;
  el.style.left = startLeft+'px';
  el.style.top = startTop+'px';
  el.style.width = w+'px';
  el.style.height = h+'px';
  el.innerHTML = iconHtml;
  document.body.appendChild(el);
  const dx = toRect.left-startLeft, dy = toRect.top-startTop;
  const sx = noScale ? 1 : (fromRect.width ? toRect.width/fromRect.width : 1);
  const move = 'translate('+dx+'px,'+dy+'px) scale('+sx+')';

  let landed = false;
  const land = ()=>{
    if(landed) return; landed = true;
    el.remove();
    if(landEl){
      landEl.style.transition = 'none';
      if(hideClass) landEl.classList.remove(hideClass);
      landEl.style.opacity = '';
      void landEl.offsetHeight;
      landEl.style.transition = '';
    }
    if(onLand) onLand();
  };

  let fadeStarted = false;
  const startFade = ()=>{
    if(fadeStarted) return; fadeStarted = true;
    if(restOpacity===undefined || restOpacity===1){ land(); return; }
    setTimeout(()=>{
      el.animate([{opacity:1},{opacity:restOpacity}], {duration:fadeMs, easing:'ease', fill:'forwards'})
        .onfinish = land;
      setTimeout(land, fadeMs+80);
    }, holdMs);
  };

  /* déplacement piloté frame par frame plutôt qu'en une seule animation vers
     des coordonnées figées : avec trackEl, la cible est relue à chaque frame
     (getBoundingClientRect), donc le clone atterrit sur la position RÉELLE du
     moment même si la mise en page bouge pendant le vol (fermeture du clavier
     qui redimensionne le viewport sur mobile, carte qui glisse encore,
     transition tardive...) au lieu de viser la position mesurée au départ et
     de laisser la vraie icône réapparaître plus bas. Sans trackEl (ou si sa
     mesure est inutilisable, rect vide ou élément mis à l'échelle par une
     classe type .pending), la cible reste le toRect figé d'origine. */
  if(!trackEl){
    const moveAnim = el.animate(
      [{transform:'translate(0,0) scale(1)'},{transform:move}],
      {duration, easing, fill:'forwards'});
    moveAnim.onfinish = startFade;
    setTimeout(startFade, duration+60); // filet de sécurité si onfinish ne se déclenche pas
    return;
  }
  el.style.transformOrigin = '0 0';
  const liveTo = ()=>{
    const r = trackEl.getBoundingClientRect();
    return (r.width||r.height) ? r : toRect;
  };
  const t0 = performance.now();
  (function step(now){
    const p = Math.min(1,(now-t0)/duration), e = 1-Math.pow(1-p,3);
    const target = liveTo();
    const tw = noScale ? w : target.width;
    const tLeft = noScale ? target.left+(target.width-tw)/2 : target.left;
    const tTop = noScale ? target.top+(target.height-h)/2 : target.top;
    const cx = startLeft+(tLeft-startLeft)*e, cy = startTop+(tTop-startTop)*e;
    const s = 1+((w ? tw/w : 1)-1)*e;
    el.style.transform = 'translate('+(cx-startLeft)+'px,'+(cy-startTop)+'px) scale('+s+')';
    if(p<1) requestAnimationFrame(step); else startFade();
  })(t0);
  setTimeout(startFade, duration+120); // filet de sécurité si la boucle rAF est gelée (onglet masqué)
}

/* taille des pastilles selon le nombre visible dans la rangée : moins il y
   en a (une est "en vol" vers une carte), plus les autres respirent. */
function dotSizeFor(visible){
  return Math.max(28, Math.min(40, 32+(N-Math.max(visible,1))*3));
}
function updateDotSize(){
  const visible = dotEls.filter(d=>!d.classList.contains('flying') && !d.classList.contains('pending')).length;
  dots.style.setProperty('--dotSize', dotSizeFor(visible)+'px');
}

/* échange la pastille "active" : celle qui revient (prevIndex, peut être
   null) regagne la rangée pendant que celle qui part (nextIndex, peut être
   null) rejoint sa carte. Les DEUX mutations DOM sont appliquées avant de
   mesurer quoi que ce soit : mesurer la cible de l'une avant que l'autre
   n'ait quitté/rejoint la rangée donnait une position fausse (l'espace
   libéré ou repris par la seconde n'était pas encore pris en compte), d'où
   un atterrissage décalé par rapport à la place réelle de la pastille. */
function swapActiveDot(prevIndex, nextIndex){
  const prevDot = prevIndex!==null ? dotEls[prevIndex] : null;
  const prevIcon = prevIndex!==null ? cards[prevIndex].querySelector('.cIcon') : null;
  const nextDot = nextIndex!==null ? dotEls[nextIndex] : null;
  const nextIcon = nextIndex!==null ? cards[nextIndex].querySelector('.cIcon') : null;
  if((prevIndex!==null && (!prevDot||!prevIcon)) || (nextIndex!==null && (!nextDot||!nextIcon))) return;

  // 1. rects de départ, avant toute mutation : ceux des deux voyageuses, et
  //    ceux de chaque pastille qui RESTE dans la rangée (pour le FLIP plus bas)
  const prevFrom = prevIcon ? prevIcon.getBoundingClientRect() : null;
  const nextFrom = nextDot ? nextDot.getBoundingClientRect() : null;
  const rowFrom = dotEls.map(d =>
    (d===prevDot || d===nextDot || d.classList.contains('pending') || d.classList.contains('flying'))
      ? null : d.getBoundingClientRect());

  // 2. les deux mutations d'abord, posées instantanément sur TOUTE la rangée
  //    (transitions coupées puis restaurées dans la même passe, comme
  //    squareStage) : si la pastille qui part rétrécissait encore pendant la
  //    mesure, la rangée restait momentanément plus haute que sa mise en page
  //    finale, tout ce qui la suit (donut, carte) était encore poussé plus
  //    bas, et le clone atterrissait trop bas par rapport à l'icône réelle.
  dotEls.forEach(d=>d.style.transition = 'none');
  if(prevDot){ prevDot.classList.remove('flying'); prevDot.style.opacity = '0'; }
  if(nextDot) nextDot.classList.add('flying');
  updateDotSize();
  void dots.offsetHeight;
  // FLIP : la mise en page est finale (mesurable tout de suite), mais chaque
  // pastille restante repart visuellement de son ancienne position (transform
  // inverse posé pendant que les transitions sont encore coupées) puis GLISSE
  // vers sa nouvelle place une fois les transitions restaurées — sans ça,
  // elles se téléportaient sèchement quand une voyageuse libérait sa place.
  const shifted = [];
  dotEls.forEach((d,k)=>{
    const from = rowFrom[k];
    if(!from) return;
    const now = d.getBoundingClientRect();
    const dx = (from.left+from.width/2)-(now.left+now.width/2);
    const dy = (from.top+from.height/2)-(now.top+now.height/2);
    if(Math.abs(dx)<0.5 && Math.abs(dy)<0.5) return;
    d.style.transform = 'translate('+dx+'px,'+dy+'px)';
    shifted.push(d);
  });
  void dots.offsetHeight;
  dotEls.forEach(d=>d.style.transition = '');
  shifted.forEach(d=>d.style.transform = '');

  // 3. les cibles sont mesurées maintenant que la rangée est déjà dans sa
  //    mise en page finale
  if(prevDot){
    const prevTo = prevDot.getBoundingClientRect();
    // pas de mise à l'échelle (noScale) : seule la position bouge, puis une
    // pause avant l'atténuation vers l'opacité de repos (0.5 si "done")
    const restOpacity = prevDot.classList.contains('done') ? 0.5 : 1;
    flyIcon(prevFrom, prevTo, CATS[prevIndex].color, CATS[prevIndex].icon, 420,
      {noScale:true, restOpacity, landEl:prevDot, trackEl:prevDot});
  }
  if(nextIcon){
    // la carte vient de recevoir .cur (voir setCurrent) et glisse encore
    // depuis sa position de départ hors écran : figer le glissement le
