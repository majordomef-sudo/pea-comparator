<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:linear-gradient(160deg,#FBFAF7 0%,#F1EFE9 100%);display:flex;align-items:center;justify-content:center}
.card{display:flex;align-items:center;gap:56px;background:#FFFFFF;border:1px solid #E6E1D8;border-radius:28px;padding:56px 64px;box-shadow:0 18px 48px rgba(18,20,26,0.10)}
.mark{width:220px;height:220px;flex:0 0 220px}
.text h1{font-size:56px;font-weight:800;color:#12141A;letter-spacing:-0.02em}
.text h1 span{color:#0F766E}
.text p{font-size:26px;color:#5C6570;margin-top:14px;font-weight:500}
.text .badge{display:inline-block;margin-top:26px;background:rgba(15,118,110,0.08);border:1px solid rgba(15,118,110,0.2);color:#0F766E;border-radius:999px;padding:8px 20px;font-size:18px;font-weight:700}
</style></head><body>
<div class="card">
 <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" rx="9" fill="#F7F6F3"/><path d="M10 8 L30 8 L26 32 L14 32 Z" fill="none" stroke="#0F766E" stroke-width="5" stroke-linejoin="round"/><line x1="14" y1="32" x2="26" y2="32" stroke="#0F766E" stroke-width="5" stroke-linecap="round"/></svg>
 <div class="text">
   <h1>Alfred <span>Invest</span></h1>
   <p>Comparez 400+ ETF PEA · Simulateurs & outils financiers</p>
   <span class="badge">Liberté financière — commencez ici</span>
 </div>
</div>
</body></html>
